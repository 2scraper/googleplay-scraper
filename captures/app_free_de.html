pp.com"],null,null,["Meta Platforms, Inc.",["android@support.whatsapp.com"],["1 Meta Way\nMenlo Park, CA 94025-1444\nUnited States"],"+1 650-853-1300"]],null,null,[[null,"WhatsApp von Meta ist eine KOSTENLOSE App für Nachrichten und Videoanrufe. Sie wird derzeit von über zwei Milliarden Menschen in mehr als 180 Ländern genutzt. Sie ist einfach, zuverlässig und privat – so bleibst du ganz leicht mit Freund*innen und Familienmitgliedern in Kontakt. WhatsApp funktioniert auf Mobil- und Desktopgeräten – auch bei langsamen Verbindungen und ohne Abogebühren*.\u003cbr\u003e    \u003cbr\u003e \u003cbr\u003e  Private Nachrichten weltweit\u003cbr\u003e \u003cbr\u003e  Deine persönlichen Nachrichten und Anrufe an Freund*innen und Familienmitglieder sind Ende-zu-Ende-verschlüsselt. Niemand außerhalb deiner Chats kann sie lesen oder anhören, nicht einmal WhatsApp.\u003cbr\u003e \u003cbr\u003e \u003cbr\u003e  Sofort, einfach und sicher verbinden \u003cbr\u003e Du brauchst nur deine Telefonnummer, keine Benutzernamen oder Anmeldedaten. Finde deine Kontakte schnell auf WhatsApp und chatte mit ihnen. \u003cbr\u003e \u003cbr\u003e Sprach- und Videoanrufe in hoher Qualität führen \u003cbr\u003e Tätige sichere Video- und Sprachanrufe mit bis zu 32 Personen – kostenlos*. Rufe auf Mobilgeräten über den Internetdienst deines Telefons an, auch bei langsamen Verbindungen. \u003cbr\u003e \u003cbr\u003e In Kontakt bleiben mit Gruppenchats \u003cbr\u003e Bleib mit Freund*innen und Familienmitglieder in Kontakt. In Ende-zu-Ende-verschlüsselten Gruppenchats kannst du Nachrichten, Fotos, Videos und Dokumente teilen – und das auf Mobil- und -Desktopgeräten. \u003cbr\u003e \u003cbr\u003e In Echtzeit in Verbindung bleiben \u003cbr\u003e Teile deinen Standort nur mit Personen in deinen Einzel- oder Gruppenchats. Du kannst das Teilen jederzeit beenden. Nimm eine Sprachnachricht auf, um dich schnell zu verbinden.\u003cbr\u003e \u003cbr\u003e \u003cbr\u003e Mit der Status-Funktion tägliche Momente teilen \u003cbr\u003e Im Status kannst du Texte, Fotos, Videos und GIFs teilen, die nach 24 Stunden wieder verschwinden. Du kannst entscheiden, ob du deine Statusmeldungen mit allen oder nur mit bestimmten Kontakten teilen möchtest. \u003cbr\u003e \u003cbr\u003e Verwende WhatsApp auf deiner Watch mit Wear OS, um Unterhaltungen fortzusetzen, auf Nachrichten zu antworten und Anrufe anzunehmen – alles direkt von deinem Handgelenk aus. Mit Kacheln und Komplikationen kannst du schnell auf deine Chats zugreifen und Sprachnachrichten senden.   \u003cbr\u003e \u003cbr\u003e*In einigen Regionen verwendet WhatsApp SMS-Verifizierung, um deine Telefonnummer zu authentifizieren und Transaktionen abzusichern.\u003cbr\u003e*Es können die normalen Datennutzungsgebühren anfallen. Kontaktiere deinen Provider für mehr Informationen.     \u003cbr\u003e______________________________________________________________  \u003cbr\u003e Für Feedback oder Fragen öffne „WhatsApp“ \u0026gt; „Einstellungen“ \u0026gt; „Hilfe“ \u0026gt; „Kontaktiere uns“.\u003cbr\u003e  \u003cbr\u003e Nutzungsbedingungen: https://www.whatsapp.com/legal/terms-of-service  \u003cbr\u003e Weitere Informationen zum privaten Nachrichtenaustausch: https://www.whatsapp.com/privacy  \u003cbr\u003e Weitere Informationen zur Sicherheit auf WhatsApp: https://www.whatsapp.com/security"]],[[null,"Einfach. Persönlich. Sicher."]],[null,null,[[["Geräte- und App-Verlauf",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/BAH0TYCVcT4bH2ErsHtCEbO-1Tr5O5Hjwst6AFghZQt5pI8NkfonAsmYfnvj939aqSVtbuM81B38AB0GYQ"]],[[null,"Aktive Apps abrufen"]],["history"]],["Identität",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/AUs-Fih7eEfuhp-4lYGGK65UvYQ2K6qaKi0dRUipSmiac-QL94IbT-XylwOgMoaYBDLuGOz1l5Yn_K6z1NM"]],[[null,"Konten auf dem Gerät finden"],[null,"Konten hinzufügen oder entfernen"],[null,"Kontaktkarten lesen"]],["perm_identity"]],["Kontakte",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/c5fJsmDZCeHY1tZmeG ium kannst du Musik herunterladen, Lieder offline hören und mit Hörbüchern aus aller Welt in spannende Geschichten eintauchen.\u003cbr\u003e\u003cbr\u003eWarum Spotify als Musikplayer und Podcast-App verwenden? Hier einige der Vorteile:\u003cbr\u003e• Streame über 100 Millionen Songs und 6 Millionen Podcasts.\u003cbr\u003e• Entdecke von Spotify zusammengestellte Playlists mit Musik von deinen Lieblingskünstler*innen.\u003cbr\u003e• Suche schnell und einfach nach Lieblingsongs, -alben und -Podcasts.\u003cbr\u003e• Erhalte personalisierte Musikempfehlungen.\u003cbr\u003e• Abonniere deine Lieblings-Podcasts kostenlos und stelle deine eigene Podcast-Bibliothek zusammen.\u003cbr\u003e\u003cbr\u003eSpotify Free ist mehr als ein Musikplayer. Du kannst Musik und Podcasts kostenlos streamen, personalisierte Playlists entdecken oder deine eigenen zusammenstellen und teilen. Und auch bei Neuerscheinungen und Events deiner Lieblingskünstler*innen bleibst du immer auf dem Laufenden.\u003cbr\u003e• Streame Millionen Songs und Podcasts kostenlos.\u003cbr\u003e• Erstelle Playlists mit deiner Lieblingsmusik.\u003cbr\u003e• Teile Songs und Playlists mit Freund*innen und Familie. (In manchen Regionen können Einschränkungen gelten.)\u003cbr\u003e• Entdecke personalisierte Playlists. Du kannst auch mit Freund*innen Playlists erstellen.\u003cbr\u003e• In „Dein Mix der Woche“ findest du jede Woche neue Songs, die dir gefallen könnten.\u003cbr\u003e• Mit „Release Radar“ und „New Music Friday“ bleibst du auf dem Laufenden.\u003cbr\u003e• Finde heraus, wann deine Lieblingskünstler*innen in der Nähe auftreten.\u003cbr\u003e• In Spotify Wrapped siehst du jedes Jahr deine am meisten gestreamten Songs, Genres, Künstler*innen, Podcasts und mehr.\u003cbr\u003e• Höre Musik auf mehreren Geräten – Spotify macht’s möglich.\u003cbr\u003e• Streame Musik über Spotify Connect auf Smart Speakern und gib Musik über PC, Laptop, Smart-TV, Chromecast, PlayStation®, Wearables und mehr wieder. Begrenzte Anzahl von Gerätemodellen.\u003cbr\u003e\u003cbr\u003eMit Spotify Premium genießt du die Vorteile eines Offline-Musikplayers und von Musik ohne Internet. Dank der Downloader-Funktion kannst du Songs, Podcasts und Playlists auch offline wiedergeben, egal wo du bist.\u003cbr\u003e• Hör Musik, Podcasts und Hörbücher ohne Ads.\u003cbr\u003e• Musik ohne Werbeunterbrechungen: Genieße deine Musik ohne Ads.\u003cbr\u003e• Spiele Inhalte auf Abruf ab.\u003cbr\u003e• Hörbücher mit Spotify Premium sind derzeit in Australien, Kanada, Irland, Neuseeland, den USA und dem Vereinigten Königreich verfügbar. Nutzer*innen von Premium Individual und Manager*innen von Duo und Family Abos können mit 15 Wiedergabestunden/Monat mehr als 250.000 Hörbücher streamen.\u003cbr\u003e• Genieße hochwertiges Audio auf unterstützen Geräten.\u003cbr\u003e• Spotify bietet jetzt einen KI-DJ: Dieser persönliche DJ kennt deinen Musikgeschmack und wählt Songs für dich aus.\u003cbr\u003e• Streame über PC, Smartphone, Tablet, Smartwatch und im Auto.\u003cbr\u003e• Hoste einen Jam mit Freund*innen, um in Echtzeit miteinander Musik zu hören und gemeinsam zu bestimmen, was als Nächstes läuft.\u003cbr\u003e• Lade Musik herunter und hör Podcasts und Hörbücher offline, auch ohne Internetverbindung.\u003cbr\u003e• Kein Vertrag erforderlich – das Spotify Premium Abo ist jederzeit kündbar.\u003cbr\u003e\u003cbr\u003eErlebe Spotify auf deinem WearOS-Gerät:  \u003cbr\u003e• Streame Musik, Podcasts und Hörbücher, ohne dein Handy mitnehmen zu müssen.\u003cbr\u003e• Erhalte sofort Zugriff auf den Spotify Musikplayer mit Kacheln und Compilations."],"Spotify AB","1.000.000.000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/WdedaGD6EAXZgy88wZM97aIcenQ5Cqzu_IUWBMMalkZmVe2lhv_3YqIUh-6pFqLv27kZ44cQX3qxyZTXHH-S91Q"],null,[91,170,147,255]],null,["USK ab 12 Jahren",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/R-TrFxpinaWjr37_CZ5GQk7NPeZIZyHcPAaW8wUutdyhiLJncPDZubg 003dcom.google.android.gm"]],["qgJgGl4IBBIdChsKFWNvbS5nb29nbGUuYW5kcm9pZC5nbRABGANKEwjR1tre7IGXAxXj9TsCHWiYMsyaARMI47SiltuBlwMVeUTnBB2oQRkm+gEPCg0IABIJCgVkZS1ERRAA"],null,[null,"Mit der offiziellen Gmail App für Ihr Android-Smartphone oder ‑Tablet profitieren Sie von allen Vorteilen, die Gmail bietet: umfassende Sicherheit, Benachrichtigungen in Echtzeit, Unterstützung für mehrere Konten und die Suche im gesamten Posteingang. Gmail ist auch auf dem Betriebssystem Wear OS verfügbar. So bleiben Sie jederzeit produktiv und können Ihre E-Mails direkt über Ihr Handgelenk verwalten.\u003cbr\u003e\u003cbr\u003eDie Gmail App bietet folgende Funktionen:\u003cbr\u003e• 99,9 % von Spam, Phishing, Malware und gefährlichen Links werden automatisch blockiert, bevor sie Ihren Posteingang erreichen.\u003cbr\u003e• Zu schnell auf „Senden“ getippt? Machen Sie den Versand einfach rückgängig.\u003cbr\u003e• Aktivieren Sie Google Chat, um sich auszutauschen und zusammenzuarbeiten.\u003cbr\u003e• Gruppenbereiche ermöglichen eine effiziente Organisation von Personen, Themen und Projekten in der Gruppe.\u003cbr\u003e• Google Meet bietet Videoanrufe in hoher Qualität.\u003cbr\u003e• Mit der Funktion „Intelligente Antwort“ können Sie E-Mails besonders schnell beantworten.\u003cbr\u003e• Sie haben die Möglichkeit, zwischen mehreren Konten zu wechseln.\u003cbr\u003e• Dateien können ganz leicht angehängt und geteilt werden.\u003cbr\u003e• Bei Eingang neuer E-Mails werden Sie über die Mitteilungszentrale, anhand von Kennzeichen oder auf dem Sperrbildschirm sofort benachrichtigt.\u003cbr\u003e• Beim Suchen in E-Mails werden schon während der Eingabe erste Ergebnisse, Vorschläge und Rechtschreibkorrekturen angezeigt.\u003cbr\u003e• Sie können Ihre E-Mails durch Labels, Markierungen, Löschen und Melden von Spam besser organisieren.\u003cbr\u003e• Mithilfe der Wischgesten zum Archivieren/Löschen lässt sich Ihr Posteingang schnell und einfach aufräumen.\u003cbr\u003e• Konversationen in E-Mails sind zu Threads zusammengefasst.\u003cbr\u003e• Namen werden bei der Eingabe automatisch aus der Liste Ihrer Google- oder Smartphonekontakte vervollständigt.\u003cbr\u003e• Sie können direkt von der App aus auf Google Kalender-Einladungen antworten.\u003cbr\u003e• Sie können auf Ihrer Wear OS-Smartwatch eine Gmail-Zusatzfunktion oder -Kachel hinzufügen, um Ihre E-Mails besser im Blick zu behalten.\u003cbr\u003e\u003cbr\u003eGmail ist Teil von Google Workspace – Sie können sich also ganz leicht mit Ihrem Team vernetzen sowie gemeinsam Dokumente erstellen und bearbeiten. Sie haben folgende Vorteile:\u003cbr\u003e• Mit Kollegen über Google Meet oder Google Chat in Kontakt bleiben, eine Einladung in Google Kalender senden, Aufgaben einer To-do-Liste hinzufügen – all das und noch viel mehr können Sie direkt in Gmail erledigen.\u003cbr\u003e• Mit vorgeschlagenen Aktionen – z. B. über die Funktionen „Intelligente Antwort“, „Intelligentes Schreiben“, „Korrekturvorschläge zur Grammatik“ und „Anstoßen“ — behalten Sie den Überblick über Ihre Arbeit und erledigen Routineaufgaben schneller. So können Sie Ihre Zeit effizienter nutzen.\u003cbr\u003e• Sie profitieren von umfassendem Schutz. Mit unseren Modellen für maschinelles Lernen werden Spam, Phishing und Malware in Gmail zu über 99,9 % blockiert, noch bevor sie Ihren Posteingang erreichen.\u003cbr\u003e\u003cbr\u003eWeitere Informationen zu Google Workspace: https://workspace.google.com/products/gmail/\u003cbr\u003e\u003cbr\u003eBleiben Sie auf dem Laufenden:\u003cbr\u003eTwitter: https://twitter.com/googleworkspace\u003cbr\u003eLinkedIn: https://www.linkedin.com/showcase/googleworkspace\u003cbr\u003eFacebook:https://www.facebook.com/googleworkspace/"],"Google LLC","10.000.000.000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/quY-Ubx6wKibxmlzxn-mJmP7Y-PbKFjCeOGscqzI8bOc2Vs6ox2F5rfKONOe-pRUX9ZQbmZcbozz95qYu-4Bp9M"],null,[189,52,36,255]],null,["USK ab 0 Jahren",[null,2,[512,512],[n D-Karte auf dein Gerät übertragen und umgekehrt.  \u003cbr\u003e  \u003cbr\u003e  \u003cb\u003eLEISTUNG\u003c/b\u003e  \u003cbr\u003e  \u003cbr\u003e  Die Gallery App belegt nur wenig Speicherplatz – das bedeutet mehr Platz für deine Fotos. Außerdem wird weniger Arbeitsspeicher auf deinem Gerät benötigt und dein Smartphone wird daher nicht langsamer.  \u003cbr\u003e  \u003cbr\u003e  \u003cb\u003eOFFLINE ARBEITEN\u003c/b\u003e  \u003cbr\u003e  \u003cbr\u003e  Gallery ist für den Offlinebetrieb optimiert, damit du Fotos und Videos in Ruhe verwalten und speichern kannst, ohne mobile Daten zu nutzen.  \u003cbr\u003e  * Die Gesichtergruppierung ist momentan nicht in allen Ländern verfügbar."],"Google LLC","1.000.000.000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/YfTUfaQPk40lEix0YKijaBesYhyri0fkflzwi3VPgAt5ABpk7So7EHP2YtIff0whrzyp3H94SiTmLM-D84dYeA"],null,[244,244,244,255]],null,["USK ab 0 Jahren",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/xjpDpgtSIWZBQ9hBSIaSjrPK90cBDBxcMX5brLAV5SwB0KuVmD_4ajQAzO-v8FhmCZUpOu3j4kWvVXJS9A"]],null,[null,"Chats"],[null,"\u003ca href\u003d\"https://support.google.com/googleplay?p\u003dappgame_ratings\"\u003eWeitere Informationen\u003c/a\u003e"],0,null,[null,2,[272,272],[null,null,"https://play-lh.googleusercontent.com/Yt3niOQLbS76NeWcUhat0tDY3c5NLfIqlNdmyTGShJcZ8db6H9K-tTcmS2RjVR0WedVabzba7W1bOlkbhg"]],[null,null,null,null,null,[null,null,"https://support.google.com/googleplay?p\u003dappgame_ratings"]]],[[[[[null,[[0,"EUR",""]],null,[null,"Kaufen"],null,1,[null,null,null,null,null,[null,null,"https://play.google.com/store/apps/details?id\u003dcom.google.android.apps.photosgo\u0026rdid\u003dcom.google.android.apps.photosgo\u0026feature\u003dmd\u0026offerId"]],null,["CAE\u003d"],null,null,null,null,null,null,null,[]]],["Installieren"],null,["CgYKBENBRT0\u003d"]]]],[2],null,[1,1,0]]],["Ähnliche Apps",null,[null,null,null,null,[null,null,"/store/apps/collection/clust
