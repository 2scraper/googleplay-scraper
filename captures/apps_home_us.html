Sbq0-"],null,1,[null,null,null,[null,null,"https://i.ytimg.com/vi/KdlfGMohVIo/hqdefault.jpg"]]]],[null,"Experience one of the best-designed painting, sketching, and drawing apps for tablets, phones, and Chromebooks. Used by millions, this award-winning app brings rich, powerful features to all artists, whether art is your hobby, passion or career.\u003cbr\u003e \u003cbr\u003e\u003cb\u003eHIGHLIGHTS\u003c/b\u003e\u003cbr\u003e- Best-in-class pencils\u003cbr\u003e- Minimal and intuitive interface\u003cbr\u003e- Robust, powerful tool set\u003cbr\u003e- Share Timelapse recordings with your friends\u003cbr\u003e- Convert brush strokes into editable shapes\u003cbr\u003e \u003cbr\u003e\u003cb\u003eREIMAGINING BRUSHES\u003c/b\u003e\u003cbr\u003e- Hundreds of built-in brushes\u003cbr\u003e- Realistic brush to canvas interaction\u003cbr\u003e- Over 100 customizable brush settings\u003cbr\u003e- Organize and share your favorite brushes and brush sets\u003cbr\u003e- Designed for stylus devices with full pressure and tilt support\u003cbr\u003e- Apply realtime color adjustments and live effects to any brush\u003cbr\u003e- Sample lower layers when blending\u003cbr\u003e- Import and export custom brushes and brush sets\u003cbr\u003e \u003cbr\u003e\u003cb\u003eGETTING THE MOST OUT OF YOUR SPACE\u003c/b\u003e\u003cbr\u003e- More canvas, less clutter with a clean, customizable interface\u003cbr\u003e- Assign finger functions separate from your stylus\u003cbr\u003e- Expand and collapse layers with a flick\u003cbr\u003e- Dock brush settings for quick, easy editing\u003cbr\u003e- Quick access eyedropper\u003cbr\u003e- Rotate and flip canvas with gestures\u003cbr\u003e- Group layers with a pinch\u003cbr\u003e \u003cbr\u003e\u003cb\u003eMAKING ART LESS WORK\u003c/b\u003e\u003cbr\u003e- Pin tools and actions to the main interface\u003cbr\u003e- Pull the color wheel on the canvas with two fingers\u003cbr\u003e- Add multiple reference images\u003cbr\u003e- Lighting-fast saving and loading\u003cbr\u003e- Step back in time with Project History\u003cbr\u003e \u003cbr\u003e\u003cb\u003eDIVERSIFYING TOOLS\u003c/b\u003e\u003cbr\u003e- Simple or complex symmetry with Radial or Kaleidoscope\u003cbr\u003e- Draw with precision using Guides or Shapes\u003cbr\u003e- Smart shape detection by pausing when drawing\u003cbr\u003e- Innovative Hatching guide\u003cbr\u003e \u003cbr\u003e\u003cb\u003eNEVER LOSING PERSPECTIVE\u003c/b\u003e\u003cbr\u003e- Design 3D cityscapes with five different Perspective Guides\u003cbr\u003e- Drag Rectangle and Circle shapes in perspective\u003cbr\u003e- Create game art with Isometric perspective\u003cbr\u003e \u003cbr\u003e\u003cb\u003ePIXEL-PERFECT EDITING\u003c/b\u003e\u003cbr\u003e- Seamless Pattern projects\u003cbr\u003e- Selection \u0026amp; Masking tools\u003cbr\u003e- Industry-leading Transformations\u003cbr\u003e- Transform multiple layers at once\u003cbr\u003e- Gradient and Pattern Fill tools\u003cbr\u003e- Target separate layers or all layers with Fill tools\u003cbr\u003e- Drag with Fill tool or Magic Wand for live tolerance adjustment\u003cbr\u003e- Bring your painting to life with Timelapse\u003cbr\u003e- Canvas Preview with flip and grayscale (for checking proportions and values)\u003cbr\u003e- Artistic \u0026amp; Photo cloning\u003cbr\u003e- Tools for pattern creation\u003cbr\u003e \u003cbr\u003e\u003cb\u003eEVERYTHING YOU NEED TO CREATE\u003c/b\u003e\u003cbr\u003e- 64-bit Deep Color when painting\u003cbr\u003e- Layer support with 30 blend modes\u003cbr\u003e- Masks for layers, adjustments, and groups\u003cbr\u003e- Clipping masks\u003cbr\u003e- Gradient map, Color Curves, and Filter layers\u003cbr\u003e- Industry-leading color correction\u003cbr\u003e- Over 40 live Filter effects\u003cbr\u003e- Focus and Tilt-shift masking\u003cbr\u003e- Liquify\u003cbr\u003e- Crop and Resize\u003cbr\u003e- Pattern and Array tools\u003cbr\u003e- Powerful selection workspace\u003cbr\u003e- Photoshop®-like smart layers for multiple transformations without loss of quality\u003cbr\u003e- Solo \u0026amp; Trace modes\u003cbr\u003e- Print presets \u0026amp; CMYK color modes\u003cbr\u003e \u003cbr\u003e\u003cb\u003eACCELERATE YOUR WORKFLOW\u003c/b\u003e\u003cbr\u003e- Import from Photos, Camera, Clipboard, or Image Search\u003cbr\u003e- Search over 1 million free for commercial-use images\u003cbr\u003e- Export images as JPG, PNG, WEBP, ZIP, layered PSD files, or Painter projects\u003cbr\u003e- Share artwork to Infinite Painter\u0026#39;s ever-growing community and see what others are creating #InfinitePainter\u003cbr\u003e \u003cbr\u003e\u003ci\u003eWHAT’S FREE?\u003c/i\u003e\u003cbr\u003e- 3 layers at the device resolution\u003cbr\u003e- Solid Fill, Lasso selection, Basic Transform and Symmetry tools\u003cbr\u003e- Seamless Pattern projects\u003cbr\u003e- All the built-in brushes and brush editing\u003cbr\u003e- Smart shape detection\u003cbr\u003e \u003cbr\u003e\u003ci\u003eWHAT’S PRO?\u003c/i\u003e\u003cbr\u003e- HD canvas sizes and tons of layers*\u003cbr\u003e- Adjustments and live Filter layers\u003cbr\u003e- Layer groups and masks\u003cbr\u003e- Over 40 powerful, professional tools\u003cbr\u003e* Maximum number of layers depends on the canvas size and your device\u003cbr\u003e \u003cbr\u003e\u003cb\u003eTAKE INFINITE PAINTER WITH YOU\u003c/b\u003e\u003cbr\u003eSee what you can do.\u003cbr\u003e \u003cbr\u003e \u003cbr\u003eARTIST CREDITS\u003cbr\u003eTiffanie Mang\u003cbr\u003eYong Hong Zhong\u003cbr\u003eKamila Stankiewicz\u003cbr\u003eAnthony Jones (RobotPencil)\u003cbr\u003eAndrew Theophilopoulos (Theonidas)\u003cbr\u003ePiotr Kann\u003cbr\u003e@dwight_theartist\u003cbr\u003eConstantine Rotkevich\u003cbr\u003eDiane Kay\u003cbr\u003eSsecretgarden\u003cbr\u003eGadelhac\u003cbr\u003eRapCore\u003cbr\u003eSunyu"],"Infinite Studio LLC","10,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/mfTA9YolGMTGb7TXrpIqy7csWxD2r57iVpoBFYlvGxbDmqUlK5H1dsgAtgnlaU
