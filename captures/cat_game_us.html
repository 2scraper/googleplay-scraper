 please disable in-app purchases in your device\u0026#39;s settings.\u003cbr\u003e\u003cbr\u003eClassic Features:\u003cbr\u003e● Build and battle in real time: Customize your layout and level up each building to strengthen your defense in war.\u003cbr\u003e● Assemble an army with countless combinations of spells, troops, and Heroes! \u003cbr\u003e\u003cbr\u003eMultiplayer:\u003cbr\u003e● Build a team and battle in Clan Wars against millions of active online players across the globe.\u2028Test your fighting skills in the competitive Clan War Leagues and prove your Clan is the best around!\u003cbr\u003e● Collect resources and plunder loot from other players to upgrade your village. Use strategy and smarts to defend your Town Hall building in war!\u003cbr\u003e● \ufeff\ufeffTest your fighting skills in Ranked Mode and take part in competitive online multiplayer battles with players from around the world. Prove your dominance and rise all the way to Legend League.\u003cbr\u003e● Keep your Clan Castle building safe and craft your defense strategy against enemy attacks. Build Towers, Cannons, Bombs, traps, Mortars, and walls to give you the edge in multiplayer battles.\u003cbr\u003e● \ufeff\ufeffAdventure with epic Heroes, like Barbarian King, Archer Queen, Grand Warden, Royal Champion, Minion Prince, Dragon Duke, and Battle Machine.\u003cbr\u003e● Use your Laboratory building to make your troops, spells, and Siege Machines even more powerful in war.\u003cbr\u003e● Flex your strategy in real time: take part in free online multiplayer games. Battle through Friendly Challenges, Friendly Wars, and special live multiplayer war game events.\u003cbr\u003e\u003cbr\u003eSingle Player:\u003cbr\u003e● Start fighting against the Goblin King in a single-player campaign mode and become a hero of the realm.\u003cbr\u003e● \ufeff\ufeffLearn new strategy tactics and experiment with army combinations and Clan Castle troops in Practice Mode.\u003cbr\u003e\u003cbr\u003eBuilder Base:\u003cbr\u003e● Adventure to the mysterious shores of Builder Base and discover new buildings, characters, and a whole new way to play.\u003cbr\u003e● Turn your Builder Base into an unbeatable fortress. Build up your defenses and perfect your fighting strategy. Conquer rival players in real time in the online multiplayer Versus Battle war game mode.\u003cbr\u003e\u003cbr\u003eWhat are you waiting for, Chief? Get ready to conquer! Join the adventure today.\u003cbr\u003e\u003cbr\u003eA network connection is also required.\u003cbr\u003e\u003cbr\u003eIf you have fun playing Clash of Clans, you may also enjoy other free multiplayer Supercell games like Clash Royale, Brawl Stars, Boom Beach, and Hay Day. Make sure to check those out!\u003cbr\u003e\u003cbr\u003eSupport: Chief, are you having problems? Visit https://help.supercellsupport.com/clash-of-clans/en/index.html or contact us in-game by going to Settings \u0026gt; Help and Support.\u003cbr\u003e\u003cbr\u003ePrivacy Policy: http://www.supercell.net/privacy-policy/\u003cbr\u003eTerms of Service: http://www.supercell.net/terms-of-service/\u003cbr\u003eParent’s Guide: http://www.supercell.net/parents\u003cbr\u003e\u003cbr\u003eThe IGRS Rating for this game is 15+\u003cbr\u003e\u003cbr\u003eNotice of Access Permission:\u003cbr\u003e\u003cbr\u003e[Optional permission]\u003cbr\u003eClash of Clans may request permission via in-game pop ups to access your camera and send you notifications.\u003cbr\u003eCamera: For in-game scanning of QR codes\u003cbr\u003eNotifications: For sending notifications related to the game\u003cbr\u003eConsent is optional and you can use the app and play the game regardless of whether or not you consent. You may refuse to give consent within the game. However, certain app features may not work properly if you refuse optional access permissions."],"Supercell","500,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/jrHf2XyMI1_PTH3Z_fHXF5caFZAN81gAUT3R3I null,null,[null,null,"https://i.ytimg.com/vi/WzV2BD4c5zs/hqdefault.jpg"]]]],[null,"Summon over 800 legendary heroes from 16 factions to battle bosses like fearsome dragons and colossal demons. Explore dungeons, enjoy turn-based multiplayer action, and master tactics to free Teleria in this epic role-playing game!\u003cbr\u003e\u003cbr\u003eTactical battles await in this turn-based dark fantasy role-playing game, where you can summon hundreds of Champions from 16 playable factions.\u003cbr\u003e\u003cbr\u003eFight the forces of the dark lord Siroth with your legendary band of immortal warriors. Train them for battle, craft the perfect strategy, and assemble the greatest raiding party ever seen.\u003cbr\u003e\u003cbr\u003eEpic clashes await in online modes like the multiplayer Arena, where you can put your team of Champions against others in strategic RPG battles. Experiment with over 1+ million possible Champion builds, craft the ultimate team and their battle tactics, and be the best!\u003cbr\u003e\u003cbr\u003eWith over 5 years of free content updates and a community that grows bigger every day, join millions of players in the war to liberate Teleria from Siroth and his legions. Become a hero of legend!\u003cbr\u003e\u003cbr\u003e| Enjoy deep RPG features |\u003cbr\u003e\u003cbr\u003eCollect powerful Champions\u003cbr\u003eSummon 800+ warriors from 16 factions in this tactical role-playing game. Call upon orcs, knights, elves, and more dark fantasy creatures to defeat any threat that stands in your way.\u003cbr\u003e\u003cbr\u003eStrategic turn-based RPG gameplay\u003cbr\u003eEquip your Champions with amazing artifacts to aid them in battle. Rank them up to unleash devastating skills, AOE attacks, magic powers and more as you lead them in combat.\u003cbr\u003e\u003cbr\u003eFight epic boss battles\u003cbr\u003eDo you dare take on the Magma Dragon, the Fire Knight, or the Ice Golem? Vanquish challenging bosses in dangerous dungeons for loot, XP, and special Champion drops. Then, in classic turn-based RPG style, fight them again for more powerful gear!\u003cbr\u003e\u003cbr\u003eFeel the visceral 3D artwork\u003cbr\u003eBeautiful, fully-rendered 3D heroes offer stunning detail down to the cracks in their armor. Marvel at a vivid fantasy world with thousands of unique skill and attack animations.\u003cbr\u003e\u003cbr\u003eJoin forces with your Clan\u003cbr\u003eTeam up with fellow players and take on challenges like the fearsome Demon Lord with Clans! Battle other Clans in special tournaments and show them that they’re out of your league.\u003cbr\u003e\u003cbr\u003eFace the multiplayer PvP Arena\u003cbr\u003eGo head-to-head with other players in fierce turn-based combat to unlock special gear. Rise through the ranks and become an Arena legend.\u003cbr\u003e\u003cbr\u003eDevelop and manage your Bastion\u003cbr\u003eUpgrade your own personal fortress to manage your Shards and ready your Champions for dungeon runs, multiplayer arena combat, and the story campaign.\u003cbr\u003e\u003cbr\u003eClear our massive PvE Campaign map\u003cbr\u003eExperience epic dark fantasy done right through 12 spectacular RPG locations spread over a sprawling, fully-voiced story campaign. Heed your heroic duty and conquer the forces of Darkness.\u003cbr\u003e\u003cbr\u003eDive into a deep fantasy world\u003cbr\u003eLearn about Teleria’s heroes and villains with our growing collection of Champion bios. Then, check out our animated limited series, RAID: Call of the Arbiter, on YouTube!\u003cbr\u003e\u003cbr\u003ePlease note:\u003cbr\u003eIn-Game Purchases (Includes Random Items): Items are available for purchase in this fantasy MMO role-playing game. Some paid items may not be refundable depending on the type of item.\u003cbr\u003e\u003cbr\u003eRAID Official Website: https://plarium.com/\u003cbr\u003eRAID Support: raid.support@plarium.com\u003cbr\u003eOur RPG Community: https://plarium.com/forum/en/raid-shadow-legends/\u003cbr\u003ePrivacy Policy: https:// pe your character through 8 unique talent trees focusing on underwater adventures, NPC guilds, events, and class-specific paths. Discover over 100 relics to modify your core skills and experiment with countless builds tailored to your playstyle.\u003cbr\u003e\u003cbr\u003e💀 Sharpen Your Skills in PvE\u003cbr\u003eCrush strong monsters and bosses in dungeons and in the open world to earn valuable rewards, weapons, and gear.\u003cbr\u003e\u003cbr\u003e⚔️ Fight in PvP in mmorpg online\u003cbr\u003e- New Arena type — the League, with a competitive ranking system\u003cbr\u003e- New Arena modes: 2x2 Retribution \u0026amp; 3x3 Retribution\u003cbr\u003e- New Arena achievements\u003cbr\u003e- Adjustments to the 5x5 Arena, 3x3 Crucible, 4x4 Crucible, 4x4 Temple of Seals, 5x5 Temple of Seals modes\u003cbr\u003e\u003cbr\u003e🛡 Play with Your Friends in mmorpg open world \u003cbr\u003eJoin with fellow adventurers in guilds and parties, guild raids and catacombs await, take part in guild battles for castles, and compete in weekly guild tournaments.\u003cbr\u003e\u003cbr\u003e⚒ Master the Craft\u003cbr\u003eTry your hand at 9 craftworks to create valuable items for yourself or for sale.\u003cbr\u003e\u003cbr\u003e💰 Trade and Communicate in mmorpg online\u003cbr\u003eSell and buy items on the free market, trade and chat with other players.\u003cbr\u003e\u003cbr\u003e👑 Become the Best Player in mmo rpg\u003cbr\u003eEarn 200+ personal achievements with unique rewards and rank up in the Top-1000.\u003cbr\u003e\u003cbr\u003e🔮 Explore a Vast Open World mmo\u003cbr\u003eExplore 11 islands and an underwater realm, take part in holiday events, and enjoy regular updates with fresh content and features every 2 months.\u003cbr\u003e\u003cbr\u003e📜 Become Part of a Great Story pixel rpg games\u003cbr\u003eComplete 1500+ storyline and daily quests to unlock a new chapter in the epic saga of Arinar!\u003cbr\u003e\u003cbr\u003e📱 Works on simple devices\u003cbr\u003eTechnical requirements:\u003cbr t online tournaments. Dive into Solitaire, Bingo, and Stars modes—fun and fresh twists on classic dice games you love!\u003cbr\u003eClimb the ranks as you play through leagues and aim for the top spot to win exciting prizes.\u003cbr\u003eWin free bonus rolls and gain the edge over your opponents!\u003cbr\u003e\u003cbr\u003eThere might be thousands of ways to play dice games like Yatzy, Crag, Balut, Yams, Farkle, or Kniffle, but there\u0026#39;s only one authentic dice app: Yahtzee® with Buddies. Roll the dice to discover why millions have loved this classic game for over 50 years—dice dreams now available on your phone! \u003cbr\u003e\u003cbr\u003eShake, score, and shout \u0026#39;Yahtzee!\u0026#39; not Yatzy or Yazy. Challenge your friends and family in the classic dice game now on mobile. Roll your way to victory anytime, anywhere, online!\u003cbr\u003e\u003cbr\u003eHASBRO and YAHTZEE names and logos are trademarks of Hasbro. © 2024 Hasbro, Pawtucket, RI 02861-1059 USA. All Rights Reserved. TM \u0026amp; ® denote U.S. Trademarks."],"Scopely","10,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/TMxG6v-y9GyC1hs3aOHdAfntz3JHkFCN3ZmsaFADjyj_cqSer0QVPoyNVIl3KQ7nIsYc7ChqxeaiINlBLfKQ4g"],null,[205,97,1,255]],null,["Everyone",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/IciOnDFecb5Xt50Q2jlcNC0LPI7LEGxNojroo-s3AozcyS-vDCwtq4fn7u3wZmRna8OewG9PBrWC-i7i"]],null,[null,"Users Interact, In-Game Purchases (Includes Random Items)"],[null,"\u003ca href\u003d\"https://support.google.com/googleplay?p\u003dappgame_ratings\"\u003eLearn more\u003c/a\u003e"],0,null,[null,2,[272,272],[null,null,"https://play-lh.googleusercontent.com/OBVqgRK7eerY0GPfK8AOzitu5oE9ecC6kG4kURTCb1K41gpqVsN0WjmJwJh-wX8vILzpcc1kYHt56aLN2g"]],[null,null,null,null,null,[null,null,"https://support.google.com/googleplay?p\u003dappgame_ratings"]]],[[[[[null,[[0,"USD",""]],null,[null,"Buy"],null,1,[null,null,null,null,null,[null,null,"http es first! ✨ Make up stories in the colourful locations, and customize your own buildings – you can style your own outfits too!\u003cbr\u003e\u003cbr\u003eToca Boca World is all about open-ended play. 🥳 There are no rules, just colorful ways to be creative. Build your world, and fill it with characters, pets, shops and all kinds of houses!\u003cbr\u003e\u003cbr\u003eAlmost everything inside Toca Boca World is customizable, or you can jump straight in and play! 🛝 Try running a café, become a hair stylist, camp in the forest or throw a rooftop party. It’s a safe universe where kids explore and discover at their own pace.\u003cbr\u003e\u003cbr\u003eBUILD YOUR OWN WORLD\u003cbr\u003e\u003cbr\u003e🏬 Explore apartments, shops and hangouts in Bop City \u003cbr\u003e👭 Design your own characters with unique hair, faces, outfits and accessories \u003cbr\u003e🏡  Decorate spaces with Home Designer. Change the walls, furniture and colors \u003cbr\u003e🐶 Add pets, food, toys and silly items so each place feels like your own\u003cbr\u003e\u003cbr\u003ePLAY YOUR WAY\u003cbr\u003e\u003cbr\u003e🤘 Create your own stories. Become a chef, spa owner, rockstar, or teacher \u003cbr\u003e🏭  Mix and match locations to invent your own mini games and challenges \u003cbr\u003e🚌 Move characters between homes, schools, shops and secret spots \u003cbr\u003e🏥 Try roleplay like running a pet hospital, opening a fashion studio or hosting a sleepover\u003cbr\u003e\u003cbr\u003eEXPLORE, DISCOVER AND COLLECT\u003cbr\u003e\u003cbr\u003e💎 Find hidden gems, secret rooms and surprises in the locations\u003cbr\u003e🎁 Visit the Post Office every Friday for free gifts including furniture, outfits, decorations and pets\u003cbr\u003e🌎 Grow your world as new packs and locations are added to the in-app shop\u003cbr\u003e\u003cbr\u003eMADE FOR KIDS, EASY TO PLAY\u003cbr\u003e\u003cbr\u003e👍  Simple, touch-first controls make it usable for all reading abilities\u003cbr\u003e🎨 No time limits or high scores. Just creative play\u003cbr\u003e🌊  Open-ended design lets kids follow their own curiosity\u003cbr\u003e\u003cbr\u003eSAFE, SINGLE-PLAYER AND AD-FREE\u003cbr\u003e\u003cbr\u003e😊 Toca Boca World is a single-player kids\u0026#39; game, not chat and no strangers\u003cbr\u003e🤝 COPPA compliant, and carefully designed as a safe space for kids\u003cbr\u003e❌ No third-party ads ever. Play is never interrupted by adverts or pop-ups\u003cbr\u003e\u003cbr\u003eAWARD-WINNING FUN FROM TOCA BOCA\u003cbr\u003e\u003cbr\u003eOur game has been recognized as App of the Year and an Editor’s Choice for its playful design and dedication to kids’ safety. Our award-winning kids game can be downloaded on phones, tablets and computers, with optional in-app purchases for families who want to expand their world. We believe in the power of play. That’s why Toca Boca World is built as a high-quality, ad-free game that lets children explore, create and imagine freely.\u003cbr\u003e\u003cbr\u003eSTAY CONNECTED\u003cbr\u003e\u003cbr\u003eDiscover new locations, events and collaborations by following Toca Boca World on social media and inside the in-app shop. There’s always a new story waiting."],"Toca Boca","100,000,000+",null,"Ages 6-12",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/6O0MIKi-3jljHyPUlYWFuLtH4ccoAWSYX9a-14nDbOxOclDE5Vk8WIM4Z58_1ONT6xc5fCAvHgRITZXa6ZffdQ"],null,[132,209,254,255]],null,["Everyone",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/IciOnDFecb5Xt50Q2jlcNC0LPI7LEGxNojroo-s3AozcyS-vDCwtq4fn7u3wZmRna8OewG9PBrWC-i7i"]],null,[null,"In-Game Purchases"],[null,"\u003ca href\u003d\"https://support.google.com/googleplay?p\u003dappgame_ratings\"\u003eLearn more\u003c/a\u003e"],0,null,[null,2,[272,272],[null,null,"https://play-lh.googleusercontent.com/OBVqgRK7eerY0GPfK8AOzitu5oE9ecC6kG4kURTCb1K41gpqVsN0WjmJwJh-wX8vILzpcc1kYHt56aLN2g"]],[null,null,null,null,null,[null,null,"https://support.google.com/googleplay?p\u003dappgame_rating
