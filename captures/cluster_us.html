’s always something new for you and your friends.\u003cbr\u003e\u003cbr\u003eIn between action-packed games, stop by the Shop to get an Outfit, Back Bling, or Emote. Show off your new look as you go no-building, all action in Zero Build, or get tactical in Reload. Brawl and play Ranked modes and qualify for Fortnite Competitive tournaments, where you can earn rewards like cash or cosmetics.\u003cbr\u003e\u003cbr\u003eThere’s a new Battle Pass every Season, with tons of rewards you can use across Fortnite, like new Outfits, Pickaxes, and Gliders. Unlock these rewards as you complete Quests and earn XP.\u003cbr\u003e\u003cbr\u003ePast and present collide in the OG Pass, where you can unlock classic looks with fresh Outfits inspired by past Seasons as you brawl your opponents.\u003cbr\u003e\u003cbr\u003eNew Seasons of Fortnite Festival bring a brand new music Icon to the stage. Perform as your favorite artists with their Outfits and hit songs in the Shop and Music Pass.\u003cbr\u003e\u003cbr\u003eGAMES IN THE FORTNITE MOBILE APP:\u003cbr\u003e- Battle Royale\u003cbr\u003e- Blitz Royale\u003cbr\u003e- Zero Build\u003cbr\u003e- Fortnite OG\u003cbr\u003e- LEGO Fortnite\u003cbr\u003e- Fortnite Festival\u003cbr\u003e- Droid Tycoon\u003cbr\u003e- Action Games\u003cbr\u003e- Developer-Made Games\u003cbr\u003e- Competitive Games\u003cbr\u003e- Multiplayer Games\u003cbr\u003e- \u0026amp; more\u003cbr\u003e\u003cbr\u003eACTION PACKED BATTLE ROYALE, WHEREVER \u0026amp; WHENEVER\u003cbr\u003e- Choose your Outfit and explore the Island in style\u003cbr\u003e- Fight to be the last one standing in this fast-paced third-person PvP shooter\u003cbr\u003e- Avoid damage as the Storm closes in\u003cbr\u003e- Coming soon: updates bringing new weapons, vehicles, and more to our competitive games\u003cbr\u003e\u003cbr\u003eBRAWL \u0026amp; COMPETE SOLO OR TEAM UP IN ZERO BUILD\u003cbr\u003e- Battle Royale without the building. Play solo or play together as a duo, trio, or 4-person multiplayer squad\u003cbr\u003e- Use your Overshield for protection because no building means more danger\u003cbr\u003e- Use natural coverage as you move through the map, and leverage your loadout to the max\u003cbr\u003e- Mantle, hurdle, jump, and more to stay competitive\u003cbr\u003e\u003cbr\u003eMORE TO EXPLORE\u003cbr\u003e- Play faster in a smaller map with fewer players in Blitz Royale\u003cbr\u003e- Jump into multiplayer games and play together\u003cbr\u003e- Perform or remix awesome music with Jam Tracks from the Shop or Music Pass\u003cbr\u003e\u003cbr\u003eIt’s all right here, in your pocket."],"Epic Games, Inc","10,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/rUAj0gwbMuol5g-a_b8f8BATk2qnUMS5Xk2_tS_VGtvKAiFqKY-8tfWle7lGgQOOBLfuPq0ryVPCuUoguKx5oto"],null,[7,16,36,255]],null,["Teen",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/mw_NfsvKM8m6RPv8Fz2GQawCOsqWv010saMnc7zbWalMxuaA9IY8h7E0VMieLxSxAFB98NFeYqbFrXXq"]],[null,"Diverse Content: Discretion Advised"],[null,"Users Interact, In-Game Purchases"],[null,"\u003ca href\u003d\"https://support.google.com/googleplay?p\u003dappgame_ratings\"\u003eLearn more\u003c/a\u003e"],0,null,[null,2,[272,272],[null,null,"https://play-lh.googleusercontent.com/xl04GurQer374yogi24hRkvUcXtMStMOcOo86Sprmrid9j6wQHF0d9xMh73CwUEg57lbsGIwpOXgrJ927Q"]],[null,null,null,null,null,[null,null,"https://support.google.com/googleplay?p\u003dappgame_ratings"]]],[[[[[null,[[0,"USD",""]],null,[null,"Buy"],null,1,[null,null,null,null,null,[null,null,"https://play.google.com/store/apps/details?id\u003dcom.epicgames.fortnite\u0026rdid\u003dcom.epicgames.fortnite\u0026feature\u003dmd\u0026offerId"]],null,["CAE\u003d"],null,null,null,null,null,null,null,[]]],["Install"],null,["CgYKBENBRT0\u003d"]]]],[2],null,[1,1,0],["$0.99 - $89.99 per item",[0],[]]],[[[[[[[]]]],null,null,null,null,null,null,null,[]],[[[[null,null,null,["Action"]]]],null,null,null,[],null,null,null,[]],[[[[null RE-E/hqdefault.jpg"]]]],[null,"Dive into an open world of building, crafting, and survival in the ultimate sandbox adventure. Gather resources, survive the night, and build a world one block at a time. Explore and craft your way through a completely open world where you can play with friends, new and old. Build a block city, start a farm, mine deep underground, face mysterious enemies, or just experiment to the limits of your imagination in this expansive simulation!\u003cbr\u003e \u003cbr\u003eCraft a new house, build a block city, or start a farm. Bring your imagination to life and build your dream avatar world where the possibilities are endless. Adventure through your own online game and play with friends, building from the ground up in our crafting simulation. In Creative mode, enjoy unlimited resources and the freedom of superior building and crafting. In Survival mode, survive the night, face intense battles, craft tools, and fend off danger. With seamless cross-platform and multiplayer games with friends on Minecraft: Bedrock Edition, you can adventure solo or with friends and discover an infinite, randomly generated game 3D world filled with blocks to mine, biomes to explore, and mobs to befriend (or battle) in a universe of crafting!\u003cbr\u003e \u003cbr\u003eIn Minecraft, the world is yours to shape!\u003cbr\u003e \u003cbr\u003eBUILD YOUR DREAM WORLD\u003cbr\u003e• Build a block city, a house, or create an entire game world from the ground up\u003cbr\u003e• Building simulator games for kids, adults, or anyone\u003cbr\u003e• Craft and build from special resources and tools to create brand new structures and landscapes\u003cbr\u003e• Explore an endless open world simulation full of different biomes and creatures\u003cbr\u003e• Minecraft Marketplace – Get creator-made add-ons, thrilling worlds, and stylish cosmetics on Minecraft Marketplace\u003cbr\u003e• Private and community servers – Online village building game allows you to connect with millions of players, or subscribe to Realms Plus to cross-play with up to 10 friends on your own private server\u003cbr\u003e• Slash commands – Tweak how the 3D game plays: you can change the weather, summon mobs, change the time of day, and more\u003cbr\u003e• Add-ons – Block builders can customize their experience even further with add-ons as they build up! If you\u0026#39;re more tech-inclined, you can modify your 3D game to create new resource packs\u003cbr\u003e \u003cbr\u003e \u003cbr\u003eMULTIPLAYER ONLINE GAMES\u003cbr\u003e• Play with friends and other builders when you join our free massive multiplayer servers\u003cbr\u003e• Multiplayer game servers allow you to play with up to 4 players online with a free Xbox Live account\u003cbr\u003e• Explore endless realms through multiplayer games with friends. With Realms and Realms Plus, you can play with up to 10 friends cross-platform, anytime, anywhere on Realms, your own private server that we host for you\u003cbr\u003e• Customize your world with Realms Plus. Get instant access to an extensive catalogue that is refreshed every month! Share with friends on your own private Realms server*\u003cbr\u003e• MMO servers allow you to connect and play with players across the world, to explore custom worlds, build with friends, and participate in large-scale events\u003cbr\u003e• Enjoy crafting buildings, building gigantic community-run worlds, competing in unique mini-games, and socializing in lobbies full of fellow Minecraft block builders\u003cbr\u003e \u003cbr\u003eSUPPORT: https://www.minecraft.net/help\u003cbr\u003eLEARN MORE: https://www.minecraft.net/\u003cbr\u003e \u003cbr\u003eMINIMUM RECOMMENDED SPECIFICATION\u003cbr\u003eTo check the requirements for your device visit: https://help.minecraft.net/hc/en-us/articles/4409172223501\u003cbr\u003e \u003cbr\u003e*Realms \u0026amp; Realms Plus: Try a free 30-day trial in-app."],"Mojang","50,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.google elaxing match-3 puzzles to earn rewards, speed up your progress, and unlock even more fun — all available offline!\u003cbr\u003eTownship — the perfect blend of city-building, farming, and match-3 gameplay!\u003cbr\u003e\u003cbr\u003eGAME FEATURES:\u003cbr\u003e● Unlimited creativity: Design and build the metropolis of your dreams!\u003cbr\u003e● Engaging match-3 puzzles: Complete fun levels to earn rewards and boost your progress!\u003cbr\u003e● Exciting competitions: Test your skills against players from around the world in regular competitions — win prizes and make unforgettable memories!\u003cbr\u003e● Exclusive collections: Gather valuable artifacts, rare antiquities, and colorful profile pictures to showcase your achievements!\u003cbr\u003e● Offline play: Enjoy Township anytime, anywhere — even without an internet connection!\u003cbr\u003e● Vibrant community: Meet friendly characters with unique personalities!\u003cbr\u003e● Social connections: Play with your Facebook friends or make new friends in the Township community!\u003cbr\u003e\u003cbr\u003eWhy You\u0026#39;ll Love Township:\u003cbr\u003e● A unique mix of city-building, farming, and match-3 gameplay!\u003cbr\u003e● Stunning graphics and charming animations\u003cbr\u003e● Regular updates with fresh content and special events\u003cbr\u003e● Personalize your town with a wide variety of decorations\u003cbr\u003e\u003cbr\u003eTownship is free to play, but some in-game elements (including randomized items) can be purchased for real money.\u003cbr\u003e\u003cbr\u003eA Wi-Fi or internet connection is not required to play.\u003cbr\u003e *An internet connection is required to access competitions and additional features.\u003cbr\u003e\u003cbr\u003eDo you like Township? Follow us!\u003cbr\u003eFacebook: facebook.com/TownshipMobile\u003cbr\u003eInstagram: instagram.com/township_mobile/\u003cbr\u003e\u003cbr\u003eNeed to report an issue or ask a question? Contact Player Support through the game by going to Settings \ y role-playing game, where you can summon hundreds of Champions from 16 playable factions.\u003cbr\u003e\u003cbr\u003eFight the forces of the dark lord Siroth with your legendary band of immortal warriors. Train them for battle, craft the perfect strategy, and assemble the greatest raiding party ever seen.\u003cbr\u003e\u003cbr\u003eEpic clashes await in online modes like the multiplayer Arena, where you can put your team of Champions against others in strategic RPG battles. Experiment with over 1+ million possible Champion builds, craft the ultimate team and their battle tactics, and be the best!\u003cbr\u003e\u003cbr\u003eWith over 5 years of free content updates and a community that grows bigger every day, join millions of players in the war to liberate Teleria from Siroth and his legions. Become a hero of legend!\u003cbr\u003e\u003cbr\u003e| Enjoy deep RPG features |\u003cbr\u003e\u003cbr\u003eCollect powerful Champions\u003cbr\u003eSummon 800+ warriors from 16 factions in this tactical role-playing game. Call upon orcs, knights, elves, and more dark fantasy creatures to defeat any threat that stands in your way.\u003cbr\u003e\u003cbr\u003eStrategic turn-based RPG gameplay\u003cbr\u003eEquip your Champions with amazing artifacts to aid them in battle. Rank them up to unleash devastating skills, AOE attacks, magic powers and more as you lead them in combat.\u003cbr\u003e\u003cbr\u003eFight epic boss battles\u003cbr\u003eDo you dare take on the Magma Dragon, the Fire Knight, or the Ice Golem? Vanquish challenging bosses in dangerous dungeons for loot, XP, and special Champion drops. Then, in classic turn-based RPG style, fight them again for more powerful gear!\u003cbr\u003e\u003cbr\u003eFeel the visceral 3D artwork\u003cbr\u003eBeautiful, fully-rendered 3D heroes offer stunning detail down to the cracks in their armor. Marvel at a vivid fantasy world with thousands of unique skill and attack animations.\u003cbr\u003e\u003cbr\u003eJoin forces with your Clan\u003cbr\u003eTeam up with fellow players and take on challenges like the fearsome Demon Lord with Clans! Battle other Clans in special tournaments and show them that they’re out of your league.\u003cbr\u003e\u003cbr\u003eFace the multiplayer PvP Arena\u003cbr\u003eGo head-to-head with other players in fierce turn-based combat to unlock special gear. Rise through the ranks and become an Arena legend.\u003cbr\u003e\u003cbr\u003eDevelop and manage your Bastion\u003cbr\u003eUpgrade your own personal fortress to manage your Shards and ready your Champions for dungeon runs, multiplayer arena combat, and the story campaign.\u003cbr\u003e\u003cbr\u003eClear our massive PvE Campaign map\u003cbr\u003eExperience epic dark fantasy done right through 12 spectacular RPG locations spread over a sprawling, fully-voiced story campaign. Heed your heroic duty and conquer the forces of Darkness.\u003cbr\u003e\u003cbr\u003eDive into a deep fantasy world\u003cbr\u003eLearn about Teleria’s heroes and villains with our growing collection of Champion bios. Then, check out our animated limited series, RAID: Call of the Arbiter, on YouTube!\u003cbr\u003e\u003cbr\u003ePlease note:\u003cbr\u003eIn-Game Purchases (Includes Random Items): Items are available for purchase in this fantasy MMO role-playing game. Some paid items may not be refundable depending on the type of item.\u003cbr\u003e\u003cbr\u003eRAID Official Website: https://plarium.com/\u003cbr\u003eRAID Support: raid.support@plarium.com\u003cbr\u003eOur RPG Community: https://plarium.com/forum/en/raid-shadow-legends/\u003cbr\u003ePrivacy Policy: https://plarium.com/en/legal/privacy-and-cookie-policy/\u003cbr\u003eTerms of Use: https://plarium.com/en/legal/terms-of-use/"],"Plarium Global Ltd","50,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/49nom060KVE8YiqOmndIEPdzQGWs8d3YbGkKxH3c3ESBJRBdBGP6pE4L0KUbelFCs8ToRCwzVYGv66RupDVH"],null,[13,20,38,255]],null,["Teen",[null,2,[512,512],[nul y the magic of digits and give your brain a great time. Become a match number master!\u003cbr\u003e\u003cbr\u003eNumber Match is an easy to learn math game that puts your gray matter to work! Merge numbers to clear the board. Coordinate your eyes, hands and mind. Enjoy hours of fun with this free number game. Time flies when you\u0026#39;re having fun with this number drop game! Install the number game now to try it and you won\u0026#39;t be able to stop!\u003cbr\u003e\u003cbr\u003eHow to play this logic puzzle:\u003cbr\u003e\u003cbr\u003e• The goal is to clear all the numbers from the board.\u003cbr\u003e• Find pairs of equal numbers (1 and 1, 7 and 7) or pairs that add up to 10 (6 and 4, 8 and 2) on the number grid.\u003cbr\u003e• Tap on the numbers one by one to cross out them and get points.\u003cbr\u003e• You can connect pairs in adjacent horizontal, vertical and diagonal cells, as well as at the end of one line and the beginning of the next.\u003cbr\u003e• If you run out of moves, you can add the remaining numbers to extra lines at the bottom.\u003cbr\u003e• Speed up your progress with Hints if you are stuck in this math game.\u003cbr\u003e• You win once all the numbers are removed from the number puzzle grid.\u003cbr\u003e\u003cbr\u003eBeat Your Score\u003cbr\u003e\u003cbr\u003eThe emptier the board is, the better your score! Score the most points by crossing out all the numbers on the field (+150 points), and removing rows (+10 points). Score +4 points by connecting numbers that are far apart. Merge numbers and enjoy these math puzzles!\u003cbr\u003e\u003cbr\u003eThere are a lot of ways to solve the logic number puzzle. But it’s not as easy as it seems. Tease your brain and enjoy an engaging number games experience! If you like merging numbers mechanics, you will definitely enjoy this logic game!\u003cbr\u003e\u003cbr\u003eWhat you get:\u003cbr\u003e\u003cbr\u003e• Easy to learn logic puzzle\u003cbr\u003e• Hours of gameplay in this number merge games\u003cbr hanics or endless daily grinds—it earns your love through pure gameplay quality. With its minimalist aesthetic and satisfying tactile feedback, it takes just seconds to learn. Yet, long after you put your phone down, its elegant logic loop will keep lingering in your mind.\u003cbr\u003eReady for a brain-teasing puzzle adventure filled with adorable felines?\u003cbr\u003eDownload Meowdoku now, put your logic to the test, and become the ultimate feline puzzle master!"],"Oakever Games","10,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/uwuSfBapAL6D7WhOM0dwIiO_icvIIQ8us7JQJiKk0mVyKhNHfgfvVbOtXe8W_L30lINIs0kamyJPg2BZb_qxYA"],null,[247,226,202,255]],null,["Everyone",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/IciOnDFecb5Xt50Q2jlcNC0LPI7LEGxNojroo-s3AozcyS-vDCwtq4fn7u3wZmRna8OewG9PBrWC-i7i"]],null,null,[null,"\u003ca href\u003d\"https://support.google.com/googleplay?p\u003dappgame_ratings\"\u003eLearn more\u003c/a\u003e"],0,[null,"Content is generally suitable for all ages. May contain minimal cartoon, fantasy or mild violence and/or infrequent use of mild language."],[null,2,[272,272],[null,null,"https://play-lh.googleusercontent.com/OBVqgRK7eerY0GPfK8AOzitu5oE9ecC6kG4kURTCb1K41gpqVsN0WjmJwJh-wX8vILzpcc1kYHt56aLN2g"]],[null,null,null,null,null,[null,null,"https://support.google.com/googleplay?p\u003dappgame_ratings"]]],[[[[[null,[[0,"USD",""]],null,[null,"Buy"],null,1,[null,null,null,null,null,[null,null,"https://play.google.com/store/apps/details?id\u003dcom.oakever.meowdoku\u0026rdid\u003dcom.oakever.meowdoku\u0026feature\u003dmd\u0026offerId"]],null,["CAE\u003d"],null,null,null,null,null,null,null,[]]],["Install"],null,["CgYKBENBRT0\u003d"]]]],[2],null,[1,1,0],["$3.99 - $69.99 per item",[0]]],[[[[[[[]]]],null,null,null,null,null,null,null,[]],[[[[null,null,null,["Puzzle"]]]],null,null,null,[],null,null,null,[]],[[[[null,null,[]]]],[[[null,null,null,null,null,[]]]],null,[],null,null,null  designed for seniors that bring back relaxation, fun, and joy. Our repertoire includes popular titles like Vita Color, Vita Jigsaw, Vita Word Search, Vita Block, Vita Sudoku, and more.\u003cbr\u003e\u003cbr\u003eHow to Play Vita Mahjong:\u003cbr\u003ePlaying free Vita Mahjong game is simple. Just aim to clear all the tiles on the board by matching tiles with identical images. Tap or slide two matching tiles, and they will vanish from the board. Your objective is to match tiles that are not concealed or blocked. Once all tiles are eliminated, it signifies successful completion of a majong game!\u003cbr\u003e\u003cbr\u003eExclusive Vita Mahjong  Game Features:\u003cbr\u003e• Classic Mahjong : Staying true to the original gameplay, it presents traditional card tile sets and hundreds of boards.\u003cbr\u003e• Special Innovations: Besides the classic, our game introduces special tiles that add a fresh twist to the classic mahjong.\u003cbr\u003e• Large-Scale Design: Our mahjong games feature large, easily readable text sizes to alleviate the strain caused by small fonts.\u003cbr\u003e• Active Mind Levels: A special mode designed to sharpen your mind and improve memory abilities in the mahjong games. \u003cbr\u003e• Customizable Scoring:  You can enjoy free classic mahjong games without a timer and any score pressure.\u003cbr\u003e• Super Combo: When you consecutively match mahjong tiles during the game, you will unlock special experiences.\u003cbr\u003e• Helpful Hints: Our game provides free useful props, such as hints, undo, and shuffle, to help players overcome challenging puzzles.\u003cbr\u003e• Daily Challenge: Take on daily practice to collect trophies and improve your classic mahjong solitaire game skills.\u003cbr\u003e• Offline Mode: Full offline support lets you enjoy Vita Mahjong anytime, anywhere, without needing internet.\u003cbr\u003e• Multi-device: Optimized for pad and phone, ensuring everyone can enjoy the classic mahjong game.\u003cbr\u003e\u003cbr\u003eVita Mahjong is a versatile game made for those who love tile matching games. Download Vita Mahjong and start your mahjong dynasty now!\u003cbr\u003e\u003cbr\u003eNote: This is a puzzle game in the style of Mahjong Solitaire. It does not contain the rules of traditional Mahjong or other types of solitaire or card games. The term “Mahjong” here refers solely to the visual style of the tiles.\u003cbr\u003e\u003cbr\u003eContact us : support@vitastudio.ai\u003cbr\u003eFor more information, you can:\u003cbr\u003eJoin our Facebook group: https://www.facebook.com/groups/vitastudio\u003cbr\u003eVisit our official website: www.vitamahjong.com"],"Vita Studio.","100,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/6yVMmYyhdqi6KWTQTgfoBssHIntR0c-6g0Vg_Alw2gabb0I9SVAMvQ81PJXHh0RA4p8QUc1RG8_BLg4SiaZN"],null,[37,86,74,255]],null,["Everyone",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/IciOnDFecb5Xt50Q2jlcNC0LPI7LEGxNojroo-s3AozcyS-vDCwtq4fn7u3wZmRna8OewG9PBrWC-i7i"]],null,[null,"In-Game Purchases"],[null,"\u003ca href\u003d\"https://support.google.com/googleplay?p\u003dappgame_ratings\"\u003eLearn more\u003c/a\u003e"],0,null,[null,2,[272,272],[null,null,"https://play-lh.googleusercontent.com/OBVqgRK7eerY0GPfK8AOzitu5oE9ecC6kG4kURTCb1K41gpqVsN0WjmJwJh-wX8vILzpcc1kYHt56aLN2g"]],[null,null,null,null,null,[null,null,"https://support.google.com/googleplay?p\u003dappgame_ratings"]]],[[[[[null,[[0,"USD",""]],null,[null,"Buy"],null,1,[null,null,null,null,null,[null,null,"https://play.google.com/store/apps/details?id\u003dcom.vitastudio.mahjong\u0026rdid\u003dcom.vitastudio.mahjong\u0026feature\u003dmd\u0026offerId"]],null,["CAE\u003d"],null,null,null,null,null,null,null,[]]],["Install"],null,["CgYKBENBRT0\u003d"]]]],[2],null,[1,1,0],["$0.99 - $49.99 per item",[0]]],[[[[[[[]]]],null,null,null,null,null,null,null,[]],[[[[null,null,null,["Board"]]]],null,null,null,[],null,null,null,[]],[[[[null,null,[]]]],[[[null  Yourself\u003cbr\u003e\u003cbr\u003eEvery round is a new chance to improve. Plan better moves, create longer combos, and keep the board open for as long as possible. There are no opponents and no pressure—just satisfying single-player gameplay and your next personal record.\u003cbr\u003e\u003cbr\u003e🔥 Download Block Blast Today!\u003cbr\u003e\u003cbr\u003eDiscover relaxing puzzle games, satisfying block-clearing action, and strategic single-player games in one easy-to-play experience. Enjoy offline games without WiFi, challenge your brain with every puzzle, and keep improving your score.\u003cbr\u003e\u003cbr\u003eBlock Blast brings together puzzle games, offline games, and single-player games anytime and anywhere. Download now and start clearing the board!"],"HungryStudio","1,000,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/9Zg8B63NDOgohogRJYOcV8vqjfh5R2eQ9xlrIt8OP23uqRtoZkvvE8FaIQZZ7xKUzx9vew2ibVxpUlWlUscDew"],null,[52,78,203,255]],null,["Everyone",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/IciOnDFecb5Xt50Q2jlcNC0LPI7LEGxNojroo-s3AozcyS-vDCwtq4fn7u3wZmRna8OewG9PBrWC-i7i"]],null,[null,"In-Game Purchases"],[null,"\u003ca href\u003d\"https://support.google.com/googleplay?p\u003dappgame_ratings\"\u003eLearn more\u003c/a\u003e"],0,null,[null,2,[272,272],[null,null,"https://play-lh.googleusercontent.com/OBVqgRK7eerY0GPfK8AOzitu5oE9ecC6kG4kURTCb1K41gpqVsN0WjmJwJh-wX8vILzpcc1kYHt56aLN2g"]],[null,null,null,null,null,[null,null,"https://support.google.com/googleplay?p\u003dappgame_ratings"]]],[[[[[null,[[0,"USD",""]],null,[null,"Buy"],null,1,[null,null,null,null,null,[null,null,"https://play.google.com/store/apps/details?id\u003dcom.block.juggle\u0026rdid\u003dcom.block.juggle\u0026feature\u003dmd\u0026offerId"]],null,["CAE\u003d"],null,null,null,null,null,null,null,[]]],["Install"],null,["CgYKBENBRT0\u003d"]]]],[2],null,[1,1,0],["$4.99 - $49.99 per item",[0]]],[[[[[[[]]]],null,null,nul wVNZarND9R8kXbmSKvnByc9"],null,1,[null,null,null,[null,null,"https://i.ytimg.com/vi/ycb_N2qVkDM/hqdefault.jpg"]]]],[null,"Hit GO! Roll the dice! Earn MONOPOLY money, interact with your friends, family members and fellow Tycoons from around the world as you explore the expanding universe of MONOPOLY GO! It’s the new way to play the classic board game - board flipping cleanup not required in these fun board games!\u003cbr\u003e\u003cbr\u003eTake a Break!\u003cbr\u003eEscape, enjoy, dream, scheme, gain rewards and stay in touch with this newly reimagined twist on MONOPOLY online games! Let everyone’s favorite zillionaire, Mr. MONOPOLY, guide you through new boards themed after world-famous cities, fantastical lands and imaginative locales. Each adventure begins with a roll of the dice - whether you\u0026#39;re a board game beginner or one of the strategy masters, there\u0026#39;s fun to be had for everyone!\u003cbr\u003e\u003cbr\u003eSo MONOPOLY GO!\u003cbr\u003e· Experience classic fun and visuals with gameplay fit for your phone! Collect Properties, build Houses and Hotels, pull Chance Cards, and of course, roll the dice to earn that MONOPOLY Money!\u003cbr\u003e· Play with your favorite game Tokens such as the Racecar, Top Hat, Battleship, and more. Earn more tokens as you go to keep the win going in these board games!\u003cbr\u003e· See classic MONOPOLY icons like Mr. M, Scottie and Ms. MONOPOLY come to life, and brand new characters too!\u003cbr\u003e\u003cbr\u003eYour Family Table!\u003cbr\u003e· Help or hinder! - Play dice \u0026amp; pick a card - You and friends can earn easy money with Community Chest and co-op events! Or heist their banks to help yourself get to the top. Don’t feel bad – that’s just how the dice roll!\u003cbr\u003e· Collect and trade story-filled Stickers with friends and family around the world and in our MONOPOLY GO game! Facebook Trading Groups! Complete gorgeous, sticker albums to win huge rewards! The more Stickers you collect, the closer you get to candy sweet exclusive bonuses and limited-edition collections!\u003cbr\u003e\u003cbr\u003eFeatures!\u003cbr\u003e\u003cbr\u003eBUY \u0026amp; BUILD YOUR WAY TO THE TOP\u003cbr\u003eCollect Property Tile Sets to build Houses and upgrade your Houses to Hotels to get even more rent from friends! All you have to do is hit GO and roll the dice! Build your empire and be lord of the board! Whether you\u0026#39;re in it for casual fun or to prove you\u0026#39;re one of the true masters of the game – the board awaits!\u003cbr\u003e\u003cbr\u003eENJOY THAT CLASSIC MONOPOLY ATMOSPHERE\u003cbr\u003eRoll the dice to enjoy the classic game of MONOPOLY. Featuring familiar faces such as MR. MONOPOLY, familiar spaces such as jail (womp womp!), Railroads, Properties, Tokens, and familiar elements like drawing the perfect lucky card and more!\u003cbr\u003e\u003cbr\u003ePLAY WITH FRIENDS AND FAMILY\u003cbr\u003eGet social! With a variety of fun games, you can play with friends around the world to take full advantage of new multiplayer mini-games such as Community Chest – where you and friends take a break from mischief and work together for fun and rewards!\u003cbr\u003e\u003cbr\u003eNEW OPPORTUNITIES EVERY DAY\u003cbr\u003ePlay Tournaments, the Prize Drop plinko mini-game, the Cash Grab mini-game and follow our Events for big rewards. New Events run every hour, there are new ways to play and win every day! Compete in every tournament to climb the ranks. Keep an eye out for our time-limited games, perfect to challenge even seasoned tournament champions and MONOPOLY masters alike. Every roll of the dice counts - will it land you bonus money, a valuable Sticker, or a big build upgrade in new lands from a candy factory to Martian land?!\u003cbr\u003e\u003cbr\u003eMONOPOLY GO! is free to play, though some in-game items can also be purchased for real money. Internet connection is required to play the game.\u003cbr\u003e\u003cbr\u003eThe MONOPOLY name and logo, the distinctive d d!\u003cbr\u003e\u003cbr\u003eCONQUER THE WORLD\u003cbr\u003eDream League Live puts your club against the very best in the world. Work your way through the ranks to prove your team is the greatest and compete in Global Leaderboards and Events for exclusive prizes!\u003cbr\u003e\u003cbr\u003eFEATURES\u003cbr\u003e• Craft your dream team from 4,000+ FIFPRO licensed players and legendary Classic greats of the game\u003cbr\u003e• Full 3D motion-captured kicks, tackles, celebrations and goalkeeper saves gives unmatched realism\u003cbr\u003e• Reach legendary status as you rise through 8 divisions and compete in more than 10 cup competitions\u003cbr\u003e• Build your soccer empire from your own Stadium to Medical, Commercial and Training facilities\u003cbr\u003e• Team up with others, achieve goals and win rewards in the all-new Clan system!\u003cbr\u003e• Recruit Agents and Scouts to help identify top talent in the transfer market\u003cbr\u003e• Immersive and exciting match commentary keeps you in the heart of the action\u003cbr\u003e• Use Coaches to develop your players technical and physical abilities\u003cbr\u003e• Customise your team’s kit and logo or import your own creations \u003cbr\u003e• Take part in regular seasons and events to win unrivalled rewards\u003cbr\u003e• Compete against players from across the globe with Dream League Live\u003cbr\u003e• Challenge yourself in daily scenarios and Dream Draft!\u003cbr\u003e\u003cbr\u003e* This game is free to play, but additional content and in-game items may be purchased for real money. To disable In-App Purchases, go to Play Store/Settings/Authentication.\u003cbr\u003e\u003cbr\u003e* This game requires an internet connection and contains third party advertising.\u003cbr\u003e\u003cbr\u003eVISIT US: firsttouchgames.com\u003cbr\u003eLIKE US:  facebook.com/dreamleaguesoccer/\u003cbr\u003eFOLLOW US:  instagram.com/playdls/\u003cbr\u003eWATCH US:  tiktok.com/@dreamleaguesoccer.ftg"],"First Touch Games Ltd.","100,000,000+",n
