025-1444\nUnited States"],"+1 650-853-1300"]],null,null,[[null,"WhatsApp from Meta is a FREE messaging and video calling app. It’s used by over 2B people in more than 180 countries. It’s simple, reliable, and private, so you can easily keep in touch with your friends and family. WhatsApp works across mobile and desktop even on slow connections, with no subscription fees*.\u003cbr\u003e    \u003cbr\u003e \u003cbr\u003e  Private messaging across the world\u003cbr\u003e \u003cbr\u003e  Your personal messages and calls to friends and family are end-to-end encrypted. No one outside of your chats, not even WhatsApp, can read or listen to them.\u003cbr\u003e \u003cbr\u003e \u003cbr\u003e  Simple and secure connections, right away \u003cbr\u003e All you need is your phone number, no user names or logins. You can quickly view your contacts who are on WhatsApp and start messaging. \u003cbr\u003e \u003cbr\u003e High quality voice and video calls \u003cbr\u003e Make secure video and voice calls with up to 32 people for free*. Your calls work across mobile devices using your phone’s Internet service, even on slow connections. \u003cbr\u003e \u003cbr\u003e Group chats to keep you in contact \u003cbr\u003e Stay in touch with your friends and family. End-to-end encrypted group chats let you share messages, photos, videos and documents across mobile and desktop. \u003cbr\u003e \u003cbr\u003e Stay connected in real time \u003cbr\u003e Share your location with only those in your individual or group chat, and stop sharing at any time. Or record a voice message to connect quickly.\u003cbr\u003e \u003cbr\u003e \u003cbr\u003e Share daily moments through Status \u003cbr\u003e Status allows you to share text, photos, video and GIF updates that disappear after 24 hours. You can choose to share status posts with all your contacts or just selected ones. \u003cbr\u003e \u003cbr\u003e Use WhatsApp on your Wear OS watch to continue conversations, reply to messages, and take calls - all from your  curated playlists, artists, and podcasts you love. Discover podcasts, new music, top songs or listen to your favorite artists and albums.\u003cbr\u003e\u003cbr\u003eWHY SPOTIFY FOR MUSIC AND PODCASTS?\u003cbr\u003e• Listen to over 80 million songs and 4 million podcasts (and counting)\u003cbr\u003e• Enjoy over 300,000 newly added audiobook titles\u003cbr\u003e• Discover new music, albums, playlists and original podcasts.\u003cbr\u003e• Search for your favorite song or artist by typing a lyric\u003cbr\u003e• Enjoy amazing sound quality on music and podcasts across all devices.\u003cbr\u003e• Create and share your own music playlists to suit your mood or discover other playlists you might like.\u003cbr\u003e• Listen to daily music mixes made just for you.\u003cbr\u003e• Explore top songs from different genres, countries or decades.\u003cbr\u003e• Subscribe to your favourite podcasts so that you never miss an episode, then curate your very own podcast library.\u003cbr\u003e• Bookmark individual podcasts into Playlists\u003cbr\u003e• Listen to music and podcasts on your mobile, tablet, desktop, PlayStation, Chromecast, TV, Wear OS or wearable device.\u003cbr\u003e\u003cbr\u003eListen and discover the latest music from artists like;\u003cbr\u003e• Bad Bunny\u003cbr\u003e• Billie Eilish\u003cbr\u003e• Renzo Pianciola\u003cbr\u003e• The Temper Trap\u003cbr\u003e• Harry Styles\u003cbr\u003e\u003cbr\u003eListen to your favorite music artists all day every day via the Popular Radio playlist feature. Here are just some of the artists we’ve already curated;\u003cbr\u003e• Taylor Swift\u003cbr\u003e• Drake\u003cbr\u003e• Eminem\u003cbr\u003e• Coldplay\u003cbr\u003e• Paolo Nutini\u003cbr\u003e• Fleetwood Mac\u003cbr\u003e\u003cbr\u003eListen to over 40 category genres - New Releases, Charts, Live Events, Made for You, At Home, Only You, Summer, Pop, Workout, Hip-Hop, Mood, Party, Pride, Dance/Electronic, Alternative, Indie, Equal, Wellness, Rock, Frequency, R\u0026amp;B, Disney,, Throwback, Radar, Chill, Sleep, In the car, Kids \u0026amp; Family, Caribbean, Classical, Romance, Jazz, Instrumental, Afro, Christian and Gospel and Country.\u003cbr\u003e\u003cbr\u003eListen to popular and exclusive podcasts like;\u003cbr\u003e• The Joe Rogan Experience\u003cbr\u003e• Modern Wisdom\u003cbr\u003e• 2 Bears, 1 Cave with Tom Segura and Bert Kreischer\u003cbr\u003e• Call Her Daddy and Crime Junkie\u003cbr\u003e\u003cbr\u003eSearch, discover and play music, podcasts and audiobooks from all over the world for free, anywhere, anytime or create your own music playlists with the latest songs to suit your mood.\u003cbr\u003e\u003cbr\u003eWHY GO PREMIUM?\u003cbr\u003e• Listen to albums and playlists without ad breaks.\u003cbr\u003e• Download and listen to music and podcasts offline, wherever you are.\u003cbr\u003e• Jump back in and listen to your top songs with on-demand playback.\u003cbr\u003e• Choose from 4 subscription options – Individual, Duo, Family, Student. There’s no commitment and you can cancel any time\u003cbr\u003e\u003cbr\u003eAudiobooks in Premium currently available in Australia, the UK \u0026amp; the US. Discover 250,000+ titles, 15 hours/month of available listening for Premium Individual subscribers and Duo \u0026amp; Family plan managers.\u003cbr\u003e\u003cbr\u003eExperience Spotify on your Wear OS device:\u003cbr\u003e• Enjoy your favourite music and podcasts without having your phone around.\u003cbr\u003e• Control playback on your phone or any of your Spotify compatible devices.\u003cbr\u003e• Download your favourite content for offline listening on the go (Premium only).\u003cbr\u003e• Get instant access to Spotify with our Tiles and Complications.\u003cbr\u003e\u003cbr\u003ePlease note: This app features Nielsen’s audience measurement software which will allow you to contribute to market research, such as Nielsen’s Audio Measurement. If you don\u0026#39;t want to participate, you can opt-out within the app settings. To learn more ab  advice, help with homework, and more.\u003cbr\u003e\u003cbr\u003eSEND YOUR PHOTOS IN HIGH DEFINITION\u003cbr\u003eSend and receive clearer, crisper picture of your favorite moments with Messenger.\u003cbr\u003e\u003cbr\u003eCREATE SHARED ALBUMS\u003cbr\u003eFrom a recent summer vacation to your grandma’s 80th birthday, create albums of photos and videos to share, organize and reminisce over important moments in your group chats.\u003cbr\u003e\u003cbr\u003eEASILY ADD NEW CONNECTIONS WITH QR CODES\u003cbr\u003eConnect with people you meet in real life by scanning their Messenger QR code or sharing yours via a link.\u003cbr\u003e\u003cbr\u003eSHARE LARGE FILES DIRECTLY IN CHAT\u003cbr\u003eWhether it’s a Word, PDF, or Excel doc, you can send large files up to 100MB right inside of Messenger.\u003cbr\u003e\u003cbr\u003eEDIT AND UNSEND MESSAGES \u003cbr\u003eHit send too soon? You can edit the message up to 15 minutes after sending\u003cbr\u003e\u003cbr\u003eDISAPPEARING MESSAGES\u003cbr\u003eSome things aren’t meant to last forever. Choose how long your end-to-end encrypted chats stick around after they’ve been read.\u003cbr\u003e\u003cbr\u003eCOME TOGETHER WITH YOUR COMMUNITIES\u003cbr\u003eMeaningfully connect with people like you from your school, neighborhood, and interest groups.\u003cbr\u003e\u003cbr\u003eGET IN YOUR FAVORITE CREATORS’ INNER CIRCLE\u003cbr\u003eStay in the know with creators by joining their broadcast channels for authentic and casual content.\u003cbr\u003e\u003cbr\u003eUNLEASH YOUR IMAGINATION W/ META AI*\u003cbr\u003eTap into your go-to creative partner to create, edit, animate images and more.\u003cbr\u003e\u003cbr\u003eCAPTURE EVERYDAY MOMENTS ON STORIES\u003cbr\u003eHighlight moments of your day using photos and videos that disappear after 24 hours in Stories.\u003cbr\u003e\u003cbr\u003eDROP A NOTE WITH YOUR THOUGHTS\u003cbr\u003eStay connected with your friends by sharing quick updates that disappear after 24 hours.\u003cbr\u003e\u003cbr\u0 e gifs. \u003cbr\u003e        •        Privacy Matters: Rest easy knowing your personal chats are protected with end-to-end encryption between Google Messages users, so no one (including Google and third parties) can read or view your messages and attachments except the person you’re messaging. Plus, enjoy advanced spam protection. \u003cbr\u003e        •        AI-Powered Messaging: Craft the perfect message with Magic Compose suggestions and our latest AI features.\u003cbr\u003e        •        Seamless Across Devices: Start a chat on your phone and continue it effortlessly on your tablet or computer. The app is also available on Wear OS.\u003cbr\u003e\u003cbr\u003eGoogle Messages is more than just messaging; it\u0026#39;s a richer, safer, and more expressive way to connect.\u003cbr\u003e\u003cbr\u003eApp is also available on Wear OS. Availability of RCS varies by region and carrier and a data plan may be required. Availability of features varies by market and device and sign up for beta testing may be required."],"Google LLC","10,000,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/ItBV4d13CkklhE7neJDJlffCJQBZEY6iHdg6LwJUAwnTuRln9TdBV5z3Jq1t7YLB5hBz3WCL-wv55Etj-bch"],null,[57,115,226,255]],null,["Everyone",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/IciOnDFecb5Xt50Q2jlcNC0LPI7LEGxNojroo-s3AozcyS-vDCwtq4fn7u3wZmRna8OewG9PBrWC-i7i"]],null,[null,"Users Interact"],[null,"\u003ca href\u003d\"https://support.google.com/googleplay?p\u003dappgame_ratings\"\u003eLearn more\u003c/a\u003e"],0,null,[null,2,[272,272],[null,null,"https://play-lh.googleusercontent.com/OBVqgRK7eerY0GPfK8AOzitu5oE9ecC6kG4kURTCb1K41gpqVsN0WjmJwJh-wX8vILzpcc1kYHt56aLN2g"]],[null,null,null,null,null,[null,null,"https://support.google.com/googleplay?p\u003dappgame_ratings"]]],[[[[[null,[[0,"USD",""]],null,[null,"Buy"],null,1,[null,null,null,null,null,[null,null,"https://play.google.com/store/apps/details?id\u003dcom.goo
