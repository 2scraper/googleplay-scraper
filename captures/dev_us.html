ogle.android.apps.bard\u0026feature\u003dmd\u0026offerId"]],null,["CAE\u003d"],null,null,null,null,null,null,null,[]],[],[null,null,null,null,[null,null,"/store/apps/details?id\u003dcom.google.android.apps.bard"]],["qgJRGk8IABIkCiIKHGNvbS5nb29nbGUuYW5kcm9pZC5hcHBzLmJhcmQQARgDShMItL2m4OyBlwMVyk3nBB0K/zBX+gEPCg0IABIJCgVlbi1VUxAA"],[[[null,null,"Z1yGy9fELtE",[null,null,"https://play.google.com/video/lava/web/player/yt:movie:Z1yGy9fELtE?autoplay\u003d1\u0026embed\u003dplay"],"yt:movie:Z1yGy9fELtE",null,null,null,null,"AXH1ezmbYeXzLd5KEvbJgJ1YlRnjBTrnXCWCKgvooHVacRkEfGWmbZcBltWJ2BZRr7P-WBCNIePCSleJYn6yIBL5nOYDCh3koUoYdw5hsb7xIU0o3AlR1E3-iVp7EDA1gDP_gluReoNrqHwzM_vBw82SLS_nlvQRUs8Tyw8zPdHqJZ1WoKnclzB5y-TQ1KaHtW7s4wfLPT9Ef_KSCuNtj1rQBKia7_i1ZJsobqr78bfCH6pXqUAoWLQIdDAcesOf67PIJn9nI_QEbBxra5cZM8QIyXfxEycjJn1Ql-pDiQ6eqlwV"],null,1,[null,null,null,[null,null,"https://i.ytimg.com/vi/Z1yGy9fELtE/hqdefault.jpg"]]]],[null,"From your morning commute to late-night deep dives, Google Gemini is your personal, proactive and powerful AI assistant.\u003cbr\u003e\u003cbr\u003eWHY USERS LOVE GEMINI\u003cbr\u003e• Our latest models, Gemini 3.6 and Gemini Omni, unlock a new world of productivity and creativity.\u003cbr\u003e• Talk things out with Gemini Live: Brainstorm in real time or share your screen/camera to discuss exactly what you see.\u003cbr\u003e• Instead of a wall of text, you get carefully crafted responses with interleaved images, timelines, and interactive visuals.\u003cbr\u003e• Get more personalized help by connecting your favorite Google apps like Gmail, Calendar, Google Photos, YouTube, and Search. \u003cbr\u003e• Upload documents, spreadsheets, photos, videos, and more to get answers, summaries, and insights about your content.\u003cbr\u003e\u003cbr\u003eBRING YOUR CREATIVE IDEAS TO LIFE\u003cbr\u003e• Generate and edit photos with Nano Banana 2: Apply camera and lighting controls, create mockups by blending multiple images, design posters with sharp text, and effortlessly build diagrams. Then, resize as needed.\u003cbr\u003e• Turn your ideas into cinematic videos with Gemini Omni for Google AI Plus, Pro, Ultra, and Workspace users.\u003cbr\u003e• Create custom soundtracks for any moment with Lyria 3.\u003cbr\u003e\u003cbr\u003eBOOST YOUR PRODUCTIVITY\u003cbr\u003e• Research with NotebookLM: Get deeper, more relevant responses that are grounded in the sources in your notebook\u003cbr\u003e• Study help and exam prep made easy: Upload your class notes to generate custom practice quizzes and interactive visuals.\u003cbr\u003e• Turn a simple prompt into a prototype: Build web pages, games, or dashboards. You can even convert your files into a podcast-style overview to listen to while you\u0026#39;re on the move.\u003cbr\u003e\u003cbr\u003eUNLOCK MORE WHEN YOU UPGRADE\u003cbr\u003eLevel up your Gemini app experience by upgrading to the Google AI Plus, Pro, or Ultra plans, helping you tackle more complex tasks and projects. \u003cbr\u003e\u003cbr\u003eReview the Gemini Apps Privacy Notice: g.co/gemini/privacynotice.\u003cbr\u003e\u003cbr\u003eIf you opt in to the Gemini app, it will replace your Google Assistant as the primary assistant on the phone. Some Google Assistant voice features aren\u0026#39;t available through the Gemini app yet. You can switch back to Google Assistant in settings."],"Google LLC","1,000,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/fSnmF9td_e3wpG1trkbuFbusZR-MzOH3skC2oA2-Rgkx31fF7wXULdJG2EyZTFw0lKo7ZpaAn5PSaj_fUVV0fQ"],null,[255,255,255,255]],null,["Teen",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/mw_NfsvKM8m6RPv8Fz2GQawCOsqWv010saMnc7zbWalMxuaA9IY8h7E0VMieLxSxAFB98NFeYqbFrXXq"]],[null,"Diverse Content: Discretion Advised"],null,[null,"\u003ca href\u003d\"https://support.google.com/googleplay?p\u003dappgame_ratings\"\u003eLearn more\u003c/a\u003e"],0,null,[null,2,[272,272],[null,null,"https://play-lh.googleusercontent.com/xl04G y\u003cbr\u003e• Add your event, concert, and sports tickets to Wallet for easy access. Just open Wallet and show your ticket when entering the event.\u003cbr\u003e• Google Wallet automatically updates your ticket with the latest event information, so you don’t miss a beat.\u003cbr\u003e\u003cbr\u003eSpeed through online checkout\u003cbr\u003e• Use the GPay button or autofill in Chrome to quickly access credit cards and debit cards saved to your Google Wallet to make online purchases.\u003cbr\u003e\u003cbr\u003eTrack your online orders\u003cbr\u003e• Link Google Wallet to Gmail to view the status and expected delivery date for your orders – all in one place. (US only)\u003cbr\u003e\u003cbr\u003eManage your digital IDs\u003cbr\u003e• Get quick, reliable access to digital versions of your driver’s license, student ID, and more.\u003cbr\u003e\u003cbr\u003eSecurity and privacy you can count on\u003cbr\u003e• Google Wallet features industry-leading security built right into your Android phone, including 2-Step Verification, Find My Phone, and remote data erase. \u003cbr\u003e• You choose the info you share between Google products, so you can better control your digital footprint.\u003cbr\u003e\u003cbr\u003eGoogle Wallet is available on all Android phones (Pie 9.0+), Wear OS and Google Fitbit devices.\u003cbr\u003eNot all features are available for supervised accounts. Learn more about Wallet for supervised accounts here: support.google.com/wallet?p\u003dabout_wallet_supervised.\u003cbr\u003eStill have questions? Head over to support.google.com/wallet."],"Google LLC","1,000,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/cjpeHS5BH1z57VgcNu6F5i9aTMyWSMWuvFh5YbFJjb-TXncs5i8GrnEaZt9ze7sdo__0JkC1lrb09TkLQz7EuQ"],null,[255,255,255,255]],null,["Everyone",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/IciOnDFecb5Xt50Q2jlcNC0LPI7LEGxNojroo-s3AozcyS-vDCwtq4fn7u3wZmRna8OewG9PBrWC-i7i"]],null,[null,"User /store/apps/dev?id\u003d5700313618786177705"]],"5700313618786177705"],null,null,null,[[null,"Download the Google app to find quick answers, explore your interests, and ask anything on your mind in any way. Try AI in Google Search with AI Mode, Lens, Search Live, and more.\u003cbr\u003e\u003cbr\u003eFeature highlights*:\u003cbr\u003e\u003cbr\u003e• AI Mode: Get AI-powered responses to your toughest questions with AI Mode–talk, type, or snap a photo to get started, and ask follow-up questions to dig deeper. You’ll continue to see a range of helpful links so you can keep exploring across the web.\u003cbr\u003e• Circle to Search: Instantly search what you see on your phone without switching apps. Circle, highlight, scribble, or tap an image, video, or text to search. Available on select premium Android smartphones in some languages and locations.\u003cbr\u003e• Google Lens: See something you like? Snap a photo and discover where to shop for it, find related images, and more. Refine your camera searches by adding words – whether you want those shoes but in ‘blue’, or want to learn how to ‘repair’ that broken bit on your bicycle.\u003cbr\u003e• Search Live: Have a live, real-time conversation in Search by using your voice and camera to easily get answers and on-screen links to the web when you need them. \u003cbr\u003e• AI Overviews: Get a snapshot of key information about a topic or question, like ’how to fix a broken zipper’, with links so you can easily explore more on the web.\u003cbr\u003e• Hum to Search: Can\u0026#39;t remember the name of that song? Hum the tune and Google will help find it for you—no lyrics, artist name or perfect pitch required. You can also search for a song playing near you.\u003cbr\u003e• Discover: Stay up-to-date on topics that matter to you. Get personalized news, articles, and videos based on your interests.\u003cbr\u003e• Google Search Widget: Search faster from your home screen or lock screen, with easy shortcuts to AI Mode, Lens, and more.\u003cbr\u003e\u003cbr\u003eGoogle Search, totally reimagined with AI\u003cbr\u003e\u003cbr\u003e• Explore a new intelligent Search box that expands with your curiosity, offers AI powered suggestions and lets you search with text, videos and more.\u003cbr\u003e• Bring your toughest questions to Search. With a more seamless Search experience, you can go from an AI Overview on the search results page to asking follow-up questions in AI Mode, with links to the web.\u003cbr\u003e• Get help with planning, researching, brainstorming new ideas, and more with the latest Gemini models delivering frontier performance for agents and coding.\u003cbr\u003e• Bring your ideas to life by transforming your photos in Lens or creating images in AI Mode with Nano Banana. Available in select languages and locations.\u003cbr\u003e\u003cbr\u003eSearch what you see with Google Lens:\u003cbr\u003e\u003cbr\u003e• Use your camera to identify what you’re looking at. Identify plants and animals, translate text in real-time, find similar products to buy, and even solve math problems with step-by-step guides.\u003cbr\u003e• Translate over 100 languages on things like road signs when you travel, menus, and more by pointing your camera at text.\u003cbr\u003e• Reverse image search: Find the source, similar photos, and related information for any image.\u003cbr\u003e• Get step-by-step homework help on math, physics and word problems, and testing your knowledge with Questions and Answers are now fully supported within the Google app.\u003cbr\u003e\u003cbr\u003eSearch safely and securely:\u003cbr\u003e\u003cbr\u003e• All searches in the Google app are protected by encrypting the connection between your device and Google.\u003cbr\u003e• Privacy controls are easy to find and use. Tap your profile picture to access your menu and delete recent search history from your account with one click.\u003cbr\u003e• Search proactively filters webspam to help ensure that you see safe, high-quality results.\u003cbr\u003e\u003cbr\u003e\u003cbr\u003eLearn more about what the Google app can do for you: https://search.google/\u003cbr\u003e\u003cbr\u003ePrivacy policy: https://www.google.com/policies/privacy\u003cbr\u003e\u003cbr\u003eYour feedback helps us create products you\u0026#39;ll love. Join a user research study here:\u003cbr\u003ehttps://goo.gl/kKQn99\u003cbr\u003e\u003cbr\u003e*Features may not be available in all countries."]],[[null,"Find what you need with Google"]],null,null,null,null,[[[null,2,[1920,1080],[null,null,"https://play-lh.googleusercontent.com/QLakcuAImL0KfrXr5rNNm31w4W7W17GNO8eXpe7fGtd6jgrWrKycNjlTGZaX1fG_bGzNQCemhdd7QHsaOkYtRA"]],[null,2,[1920,1080],[null,null,"https://play-lh.googleusercontent.com/-EKKnMQxzUE2XLHeINO-hl4R_fYB0ztiReQRInaWoBiATB-3NTZVOu7XIL1KzdYE4mJYLJZYS0WgxAFihTuw5g"]],[null,2,[1920,1080],[null,null,"https://play-lh.googleusercontent.com/QpyRyRVYTQh4WXL7YlOqhVc0xTqmrGK6feh5_geU4xRy4uFR3KEpnzV4rqK6I2Shh9NgT9rjBuoErCcJDNo"]],[null,2,[1920,1080],[null,null,"https://play-lh.googleusercontent.com/tvoB36uf5mV3LvudbIz33R_orhdzXy-M8WUgcnv2wtCGAaA_snB79iBH4WskZQawnpT1kXlu-WF-n0nbCJYB8Zo"]],[null,2,[1920,1080],[null,null,"https://play-lh.googleusercontent.com/1KkKXB2W8a2IOgL1rOVxqvVSZaehANda3Q_N3r4PV8ykbc00NzPm1CUrIv1fzOb2nDB5tsArA0icnwcXfX_Hd5w"]],[null,2,[1920,1200],[null,null,"https://play-lh.googleusercontent.com/fzd0mcUCs7REiQi2h77M0noLT7YN8_HooKV35c463mEqqfdNZ4SGvWsN5YYZHJdkUiamn3v-zNBUs8n2MFhtO48"]],[null,2,[1920,1200],[null,null,"https://play-lh.googleusercontent.com/V9TkIUWCCyLTk33AfucdSH_EujSxloo9TP6RL4RNrvWaP_6nu4Wq081JWTIHDotZxDyinWdREkp9iArm4GwW8g"]],[null,2,[1920,1200],[null,null,"https://play-lh.googleusercontent.com/zHGq5yA1ekKYspBec4aDIPs-u_0kapJrTTZ9L_IyTyjervH-2BSV3zLgH3kmWATbwkCOa8ldK5XDhGhWFD2Ssg"]],[null,2,[1920,1200],[null,null,"https://play-lh.googleusercontent.com/n4deFntJrFZPHUF1gGTNTxW2HSyn69ssrbbHCDmRlcGJBOb8uQIZeUGPOJvC0WR6k6MI_Ku6ylwmw7ya8Y1pbAw"]],[null,2,[2560,1600],[null,null,"https://play-lh.googleusercontent.co
