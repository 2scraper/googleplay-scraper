<script>AF_initDataCallback({key: 'ds:5', hash: '9', data:[[[[]]],[null,null,[["Minecraft: Dream it, Build it!"],null,null,null,null,null,null,null,[0,1,[0]],["Everyone 10+",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/csiz76udPjXmaJddU_1sanHGlQAAbKkvlprK3DSUNmwu1nY3U6qnXRrI2IDMaivooYK1x11oxz3PEO4z"]],[null,"Fantasy Violence"],[null,"Users Interact, In-Game Purchases"],[null,"\u003ca href\u003d\"https://support.google.com/googleplay?p\u003dappgame_ratings\"\u003eLearn more\u003c/a\u003e"],0,null,[null,2,[272,272],[null,null,"https://play-lh.googleusercontent.com/bxs95MghtAOuZR_LPwVCUmUPYEvXsGVOH3chF1OCX0-Ns_S0qdHnzml2CGCgOGbYlftKsmt9gtpxLb8U"]],[null,null,null,null,null,[null,null,"https://support.google.com/googleplay?p\u003dappgame_ratings"]]],["Aug 15, 2011",[1313475441,825000000]],null,null,["50,000,000+",50000000,97438900,"50M+"],null,null,null,null,[2],["$0.99 - $49.99 per item",[0]],null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,["Mojang"],null,null,null,null,[1,1,0],null,null,null,null,null,null,null,null,[["4.3",4.3080287],[null,["618,320",618320],["177,798",177798],["269,243",269243],["495,626",495626],["4,278,553",4278553]],["5,839,547",5839547],["634,943",634943],null,[null,[]]],null,null,null,null,null,[[[[[null,[[6990000,"USD","$6.99"]],null,[null,"Buy"],null,2,[null,null,null,null,null,[null,null,"https://play.google.com/store/apps/details?id\u003dcom.mojang.minecraftpe\u0026rdid\u003dcom.mojang.minecraftpe\u0026feature\u003dmd\u0026offerId"]],null,["CAE\u003d"],null,null,null,null,null,null,null,[],null,null,[["ChromeOS version sold separately"]]]],["$6.99 Buy"],null,["CgYKBENBRT0\u003d"]]]],["top paid arcade",[],"#1"],null,null,null,null,null,null,null,null,null,["Mojang",[null,null,null,null,[null,null,"/store/apps/dev?id\u003d4772240228547998649"]],"4772240228547998649"],[[null,null,null,null,null,[null,null,"http://help.mojang.com"]],["help@minecraft.net"],null,null,["Microsoft Corporation",["contactmojang@minecraft.net"],["1 Microsoft Way\nRedmond, WA 98052\nUnited States"],"+1 800-642-7676"]],null,null,[[null,"Dive into an open world of building, crafting, and survival in the ultimate sandbox adventure. Gather resources, survive the night, and build a world one block at a time. Explore and craft your way through a completely open world where you can play with friends, new and old. Build a block city, start a farm, mine deep underground, face mysterious enemies, or just experiment to the limits of your imagination in this expansive simulation!\u003cbr\u003e \u003cbr\u003eCraft a new house, build a block city, or start a farm. Bring your imagination to life and build your dream avatar world where the possibilities are endless. Adventure through your own online game and play with friends, building from the ground up in our crafting simulation. In Creative mode, enjoy unlimited resources and the freedom of superior building and crafting. In Survival mode, survive the night, face intense battles, craft tools, and fend off danger. With seamless cross-platform and multiplayer games with friends on Minecraft: Bedrock Edition, you can adventure solo or with friends and discover an infinite, randomly generated game 3D world filled with blocks to mine, biomes to explore, and mobs to befriend (or battle) in a universe of crafting!\u003cbr\u003e \u003cbr\u003eIn Minecraft, the world is yours to shape!\u003cbr\u003e \u003cbr\u003eBUILD YOUR DREAM WORLD\u003cbr\u003e• Build a block city, a house, or create an entire game world from the ground up\u003cbr\u003e• Building simulator games for kids, adults, or anyone\u003cbr\u003e• Craft and build from special resources and tools to create brand new structures and landscapes\u003cbr\u003e• Explore an endless open world simulation full of different biomes and creatures\u003cbr\u003e• Minecraft Marketplace – Get creator-made add-ons, thrilling worlds, and stylish cosmetics on Minecraft Marketplace\u003cbr\u003e• Private and community servers – Online village building game allows you to connect with millions of players, or subscribe to Realms Plus to cross-play with up to 10 friends on your own private server\u003cbr\u003e• Slash commands – Tweak how the 3D game plays: you can change the weather, summon mobs, change the time of day, and more\u003cbr\u003e• Add-ons – Block builders can customize their experience even further with add-ons as they build up! If you\u0026#39;re more tech-inclined, you can modify your 3D game to create new resource packs\u003cbr\u003e \u003cbr\u003e \u003cbr\u003eMULTIPLAYER ONLINE GAMES\u003cbr\u003e• Play with friends and other builders when you join our free massive multiplayer servers\u003cbr\u003e• Multiplayer game servers allow you to play with up to 4 players online with a free Xbox Live account\u003cbr\u003e• Explore endless realms through multiplayer games with friends. With Realms and Realms Plus, you can play with up to 10 friends cross-platform, anytime, anywhere on Realms, your own private server that we host for you\u003cbr\u003e• Customize your world with Realms Plus. Get instant access to an extensive catalogue that is refreshed every month! Share with friends on your own private Realms server*\u003cbr\u003e• MMO servers allow you to connect and play with players across the world, to explore custom worlds, build with friends, and participate in large-scale events\u003cbr\u003e• Enjoy crafting buildings, building gigantic community-run worlds, competing in unique mini-games, and socializing in lobbies full of fellow Minecraft block builders\u003cbr\u003e \u003cbr\u003eSUPPORT: https://www.minecraft.net/help\u003cbr\u003eLEARN MORE: https://www.minecraft.net/\u003cbr\u003e \u003cbr\u003eMINIMUM RECOMMENDED SPECIFICATION\u003cbr\u003eTo check the requirements for your device visit: https://help.minecraft.net/hc/en-us/articles/4409172223501\u003cbr\u003e \u003cbr\u003e*Realms \u0026amp; Realms Plus: Try a free 30-day trial in-app."]],[[nul ft: Bedrock Edition, you can adventure solo or with friends and discover an infinite, randomly generated game 3D world filled with blocks to mine, biomes to explore, and mobs to befriend (or battle) in a universe of crafting!\u003cbr\u003e \u003cbr\u003eIn Minecraft, the world is yours to shape!\u003cbr\u003e \u003cbr\u003eBUILD YOUR DREAM WORLD\u003cbr\u003e• Build a block city, a house, or create an entire game world from the ground up\u003cbr\u003e• Building simulator games for kids, adults, or anyone\u003cbr\u003e• Craft and build from special resources and tools to create brand new structures and landscapes\u003cbr\u003e• Explore an endless open world simulation full of different biomes and creatures\u003cbr\u003e• Minecraft Marketplace – Get creator-made add-ons, thrilling worlds, and stylish cosmetics on Minecraft Marketplace\u003cbr\u003e• Private and community servers – Online village building game allows you to connect with millions of players, or subscribe to Realms Plus to cross-play with up to 10 friends on your own private server\u003cbr\u003e• Slash commands – Tweak how the 3D game plays: you can change the weather, summon mobs, change the time of day, and more\u003cbr\u003e• Add-ons – Block builders can customize their experience even further with add-ons as they build up! If you\u0026#39;re more tech-inclined, you can modify your 3D game to create new resource packs\u003cbr\u003e \u003cbr\u003e \u003cbr\u003eMULTIPLAYER ONLINE GAMES\u003cbr\u003e• Play with friends and other builders when you join our free massive multiplayer servers\u003cbr\u003e• Multiplayer game servers allow you to play with up to 4 players online with a free Xbox Live account\u003cbr\u003e• Explore endless realms through multiplayer games with friends. With Realms and Realms Plus, you can play with up to 10 friends cross-platform, anytime, anywhere on Realms, your own private server that we host for you\u003cbr\u003e• Customize your world with Realms Plus. Get instant access to
